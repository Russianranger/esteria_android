// Optional immutable server extractors. Installation never launches local services.
def serverExtractorsProvider = providers.gradleProperty('serverExtractorsProviderDir').orNull
def serverExtractorsPinFile = rootProject.file('runtime/server/extractors-provider.lock.json')
def serverExtractorsPin = new groovy.json.JsonSlurper().parse(serverExtractorsPinFile)
def serverExtractorsPinHash = java.security.MessageDigest.getInstance('SHA-256').digest(serverExtractorsPinFile.bytes).encodeHex().toString()
android.defaultConfig.buildConfigField 'boolean', 'SERVER_EXTRACTORS_PACKAGED', serverExtractorsProvider ? 'true' : 'false'
android.defaultConfig.buildConfigField 'String', 'SERVER_EXTRACTORS_REVISION', '"' + serverExtractorsPin.serverRevision + '"'
android.defaultConfig.buildConfigField 'String', 'SERVER_EXTRACTORS_PIN', '"' + serverExtractorsPinHash + '"'
if (serverExtractorsProvider) {
    if (serverExtractorsPin.state != 'sealed-source-and-native-cli' || serverExtractorsPin.sourceCompanionComplete != true ||
        serverExtractorsPin.sourceQualification == null)
        throw new GradleException('Server extractors require the actual pinned complete-source rebuild receipt; current provider is unsealed')
    if (providers.gradleProperty('nativeBridgeAbi').getOrElse('arm64-v8a') != 'arm64-v8a' ||
        providers.gradleProperty('presentationEmulatorTest').getOrElse('false') == 'true' ||
        ['prootProbeProviderDir', 'mysqlProbeProviderDir', 'wineProbeProviderDir'].any { providers.gradleProperty(it).isPresent() })
        throw new GradleException('Server extractors use only the production ARM64 profile, separately from emulator fixtures')
    if (!providers.gradleProperty('serverRuntimeProviderDir').isPresent())
        throw new GradleException('Server extractors require their separately verified Ubuntu ARM64 server dependency provider')
    def provider = file(serverExtractorsProvider)
    android.sourceSets.main.assets.srcDir(new File(provider, 'assets'))
    android.androidResources.noCompress += ['archive']
    def verifyServerExtractors = tasks.register('verifyServerExtractorsProvider', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/provider_server_extractors.py', 'verify', '--provider', provider.absolutePath
    }
    tasks.named('preBuild').configure { dependsOn verifyServerExtractors }
}
