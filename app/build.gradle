plugins { id 'com.android.application' }
def sourceLock = new groovy.json.JsonSlurper().parse(rootProject.file('sources.lock.json'))
def clientRevision = sourceLock.sources.client.commit
def serverRevision = sourceLock.sources.server.commit
def prootProvider = providers.gradleProperty('prootProviderDir').orNull
def serverProvider = providers.gradleProperty('serverRuntimeProviderDir').orNull
def clientProvider = providers.gradleProperty('clientRuntimeProviderDir').orNull
def clientArtifact = providers.gradleProperty('clientRuntimeArtifact').orNull
def clientSource = providers.gradleProperty('clientRuntimeSource').orNull
if ((clientProvider || clientArtifact || clientSource) && !(clientProvider && clientArtifact && clientSource))
    throw new GradleException('Client provider requires clientRuntimeProviderDir, clientRuntimeArtifact and clientRuntimeSource for exact source/artifact verification')
def guestBridgeProvider = providers.gradleProperty('guestBridgeProviderDir').orNull
def nativeBridge = providers.gradleProperty('nativeRuntimeBridge').getOrElse('false').toBoolean()
def nativeAbi = providers.gradleProperty('nativeBridgeAbi').getOrElse('arm64-v8a')
def presentationEmulator = providers.gradleProperty('presentationEmulatorTest').getOrElse('false').toBoolean()
if (!(nativeAbi in ['arm64-v8a', 'x86_64']) || (prootProvider && nativeAbi != 'arm64-v8a'))
    throw new GradleException('Native bridge ABI must be arm64-v8a, or x86_64 without the ARM64 PRoot provider')
if (presentationEmulator && (!nativeBridge || nativeAbi != 'x86_64' || prootProvider ||
        gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }))
    throw new GradleException('presentationEmulatorTest is an explicit x86_64 debug/test-only native build')
if (!(clientRevision ==~ /[0-9a-f]{40}/) || !(serverRevision ==~ /[0-9a-f]{40}/))
    throw new GradleException('sources.lock.json requires full client and server commit SHAs')
android {
    namespace 'io.github.russianranger.esteria'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.russianranger.esteria'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('buildVersionCode').getOrElse('1').toInteger()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionName '0.1.0-dev'
        buildConfigField 'String', 'SOURCE_REVISION', '"' + providers.gradleProperty('sourceRevision').getOrElse('local-uncommitted').replaceAll('[^a-zA-Z0-9._-]', '_') + '"'
        buildConfigField 'String', 'CLIENT_REVISION', '"' + clientRevision + '"'
        buildConfigField 'String', 'SERVER_REVISION', '"' + serverRevision + '"'
        buildConfigField 'boolean', 'PROOT_PACKAGED', prootProvider ? 'true' : 'false'
        buildConfigField 'boolean', 'SERVER_RUNTIME_PACKAGED', serverProvider ? 'true' : 'false'
        buildConfigField 'boolean', 'CLIENT_RUNTIME_PACKAGED', clientProvider ? 'true' : 'false'
        buildConfigField 'boolean', 'GUEST_BRIDGES_PACKAGED', guestBridgeProvider ? 'true' : 'false'
        buildConfigField 'boolean', 'PRESENTATION_EMULATOR_TEST', presentationEmulator ? 'true' : 'false'
        ndk { abiFilters nativeBridge ? nativeAbi : 'arm64-v8a' }
        if (nativeBridge) externalNativeBuild { cmake {
            arguments '-DANDROID_STL=c++_static', '-DESTERIA_PRESENTATION_EMULATOR_TEST=' + (presentationEmulator ? 'ON' : 'OFF')
        } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    if (nativeBridge) {
        ndkVersion '28.2.13676358'
        externalNativeBuild { cmake { path rootProject.file('native/CMakeLists.txt'); version '3.22.1' } }
    }
    packaging { jniLibs {
        useLegacyPackaging true // Android installs process payloads in nativeLibraryDir.
        keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so'] // Preserve verified ELF hashes.
    } }
    androidResources { noCompress += ['archive'] }
    lint { disable 'ChromeOsAbiSupport' } // This project deliberately targets ARM64 handhelds.
    signingConfigs {
        development {
            def keyPath = System.getenv('ESTERIA_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ESTERIA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ESTERIA_KEY_ALIAS') ?: 'esteria'
                keyPassword System.getenv('ESTERIA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix = null }
        release {
            minifyEnabled false
            if (System.getenv('ESTERIA_KEYSTORE_PATH')) signingConfig signingConfigs.development
        }
    }
}
dependencies {
    implementation project(':core')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Reuse the exact host installer contracts on Android's real app-private filesystem.
def installerTestFixture = tasks.register('copyInstallerTestFixture', Copy) {
    from rootProject.file('core/src/test/java')
    include '**/runtime/install/RuntimeInstallerTests.java'
    include '**/runtime/install/LocalAccountHandoffTests.java'
    into layout.buildDirectory.dir('generated/installerTestFixture')
}
android.sourceSets.androidTest.java.srcDir(layout.buildDirectory.dir('generated/installerTestFixture'))
tasks.named('preBuild').configure { dependsOn installerTestFixture }

// Package the authoritative lock file verbatim. Support exports distinguish source
// pins from qualified runtime binaries; these pins alone never enable gameplay.
def sourcePins = tasks.register('generateSourcePins', Copy) {
    from rootProject.file('sources.lock.json')
    from rootProject.file('runtime/runtime-sources.lock.json')
    from rootProject.file('runtime/bridges/x11-runtime.lock.json')
    into layout.buildDirectory.dir('generated/sourcePins')
}
if (nativeBridge) {
    def nativeNotices = tasks.register('copyNativeNotices', Copy) {
        from rootProject.file('native/process-owner/FTA-MIT-LICENSE.txt')
        from(rootProject.file('LICENSE')) { rename { 'ESTERIA-GPL-3.0.txt' } }
        // Static libc++/compiler runtimes retain the exact installed NDK notices.
        def llvmHost = {
            def hosts = new File(android.ndkDirectory, 'toolchains/llvm/prebuilt').listFiles()?.findAll { it.isDirectory() }
            if (hosts == null || hosts.size() != 1) throw new GradleException('Expected one installed NDK host toolchain')
            hosts[0]
        }
        from({ new File(android.ndkDirectory, 'NOTICE') }) { rename { 'NDK-28.2.13676358-NOTICE.txt' } }
        from({ new File(llvmHost(), 'NOTICE') }) { rename { 'LLVM-RUNTIME-NOTICE.txt' } }
        from({ new File(llvmHost(), 'sysroot/NOTICE') }) { rename { 'NDK-SYSROOT-NOTICE.txt' } }
        doFirst {
            for (def notice : [new File(android.ndkDirectory, 'NOTICE'), new File(llvmHost(), 'NOTICE'), new File(llvmHost(), 'sysroot/NOTICE')])
                if (!notice.isFile() || notice.length() == 0) throw new GradleException('Installed NDK runtime notice is missing')
        }
        into layout.buildDirectory.dir('generated/nativeNotices/notices')
    }
    android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/nativeNotices'))
    tasks.named('preBuild').configure { dependsOn nativeNotices }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/sourcePins'))
tasks.named('preBuild').configure { dependsOn sourcePins }

// Native process executables are built from locked sources outside Git. This
// optional provider adds no gameplay capability until the runtime is qualified.
if (prootProvider) {
    def provider = file(prootProvider)
    android.sourceSets.main.jniLibs.srcDir(new File(provider, 'jniLibs'))
    android.sourceSets.main.assets.srcDir(new File(provider, 'assets'))
    def verifyProot = tasks.register('verifyProotProvider', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/verify_android_proot.py', '--provider', provider.absolutePath
    }
    tasks.named('preBuild').configure { dependsOn verifyProot }
}

// Optional verified server rootfs asset. Default APKs do not contain a server payload.
if (serverProvider) {
    def provider = file(serverProvider)
    android.sourceSets.main.assets.srcDir(new File(provider, 'assets'))
    def verifyServerRuntime = tasks.register('verifyServerRuntimeProvider', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/provider_server_runtime.py', 'verify', '--provider', provider.absolutePath
    }
    tasks.named('preBuild').configure { dependsOn verifyServerRuntime }
}

// Reconstructed PE files retain their measured source/artifact identity. A
// provider's own descriptor is insufficient authority for accepting new bytes.
if (clientProvider) {
    def provider = file(clientProvider)
    android.sourceSets.main.assets.srcDir(new File(provider, 'assets'))
    def verifyClientRuntime = tasks.register('verifyClientRuntimeProvider', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/provider_client_runtime.py', 'verify',
            '--provider', provider.absolutePath, '--artifact', file(clientArtifact).absolutePath,
            '--client-source', file(clientSource).absolutePath
    }
    tasks.named('preBuild').configure { dependsOn verifyClientRuntime }
}

apply from: 'proot-probe.gradle'
apply from: 'database-setup.gradle'
apply from: 'mysql-probe.gradle'
apply from: 'shader-provider.gradle'
apply from: 'turnip-provider.gradle'
apply from: 'server-programs.gradle'
apply from: 'server-extractors.gradle'
apply from: 'server-content.gradle'
apply from: 'server-schema.gradle'
apply from: 'server-installation.gradle'
apply from: 'wine-probe.gradle'

// Exact source-built X11/ALSA payload, separate from the Wine rootfs and saves.
if (guestBridgeProvider) {
    def provider = file(guestBridgeProvider)
    android.sourceSets.main.assets.srcDir(new File(provider, 'assets'))
    def verifyGuestBridges = tasks.register('verifyGuestBridgeProvider', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/provider_guest_bridges.py', 'verify', '--provider', provider.absolutePath
    }
    tasks.named('preBuild').configure { dependsOn verifyGuestBridges }
}
