plugins { id 'com.android.application' }
def sourceLock = new groovy.json.JsonSlurper().parse(rootProject.file('sources.lock.json'))
def clientRevision = sourceLock.sources.client.commit
def serverRevision = sourceLock.sources.server.commit
def prootProvider = providers.gradleProperty('prootProviderDir').orNull
if (!(clientRevision ==~ /[0-9a-f]{40}/) || !(serverRevision ==~ /[0-9a-f]{40}/))
    throw new GradleException('sources.lock.json requires full client and server commit SHAs')
android {
    namespace 'io.github.russianranger.esteria'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.russianranger.esteria'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev'
        buildConfigField 'String', 'SOURCE_REVISION', '"' + providers.gradleProperty('sourceRevision').getOrElse('local-uncommitted').replaceAll('[^a-zA-Z0-9._-]', '_') + '"'
        buildConfigField 'String', 'CLIENT_REVISION', '"' + clientRevision + '"'
        buildConfigField 'String', 'SERVER_REVISION', '"' + serverRevision + '"'
        buildConfigField 'boolean', 'PROOT_PACKAGED', prootProvider ? 'true' : 'false'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    packaging { jniLibs {
        useLegacyPackaging true // Android installs process payloads in nativeLibraryDir.
        keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so'] // Preserve verified ELF hashes.
    } }
    lint { disable 'ChromeOsAbiSupport' } // This project deliberately targets ARM64 handhelds.
    signingConfigs {
        development {
            def keyPath = System.getenv('ESTERIA_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ESTERIA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ESTERIA_KEY_ALIAS') ?: 'esteria'
                keyPassword System.getenv('ESTERIA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix = null }
        release {
            minifyEnabled false
            if (System.getenv('ESTERIA_KEYSTORE_PATH')) signingConfig signingConfigs.development
        }
    }
}
dependencies { implementation project(':core') }

// Package the authoritative lock file verbatim. Support exports distinguish source
// pins from qualified runtime binaries; these pins alone never enable gameplay.
def sourcePins = tasks.register('generateSourcePins', Copy) {
    from rootProject.file('sources.lock.json')
    from rootProject.file('runtime/runtime-sources.lock.json')
    into layout.buildDirectory.dir('generated/sourcePins')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/sourcePins'))
tasks.named('preBuild').configure { dependsOn sourcePins }

// Native process executables are built from locked sources outside Git. This
// optional provider adds no gameplay capability until the runtime is qualified.
if (prootProvider) {
    def provider = file(prootProvider)
    android.sourceSets.main.jniLibs.srcDir(new File(provider, 'jniLibs'))
    android.sourceSets.main.assets.srcDir(new File(provider, 'assets'))
    def verifyProot = tasks.register('verifyProotProvider', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/verify_android_proot.py', '--provider', provider.absolutePath
    }
    tasks.named('preBuild').configure { dependsOn verifyProot }
}
