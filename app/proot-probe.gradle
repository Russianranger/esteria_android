// Explicit emulator-only probe; ordinary and production ARM64 APKs are unchanged.
def probeProvider = providers.gradleProperty('prootProbeProviderDir').orNull
if (providers.gradleProperty('nativeRuntimeBridge').getOrElse('false') == 'true')
    android.defaultConfig.externalNativeBuild.cmake.arguments "-DESTERIA_PROOT_EXECUTION_TEST=${probeProvider ? 'ON' : 'OFF'}"
if (probeProvider) {
    if (providers.gradleProperty('nativeRuntimeBridge').getOrElse('false') != 'true' ||
        providers.gradleProperty('nativeBridgeAbi').getOrElse('arm64-v8a') != 'x86_64' ||
        providers.gradleProperty('prootProviderDir').isPresent() ||
        providers.gradleProperty('presentationEmulatorTest').getOrElse('false') == 'true')
        throw new GradleException('PRoot probe requires the separate x86_64 owner-only test configuration')
    def provider = file(probeProvider)
    androidComponents.beforeVariants(androidComponents.selector().withBuildType('release')) { variant -> variant.enable = false }
    android.sourceSets.debug.java.srcDir('src/prootProbe/java')
    android.sourceSets.debug.manifest.srcFile('src/prootProbe/AndroidManifest.xml')
    android.sourceSets.main.jniLibs.srcDir(new File(provider, 'jniLibs'))
    android.sourceSets.main.assets.srcDir(new File(provider, 'assets'))
    android.packaging.jniLibs.keepDebugSymbols += ['**/libproot_probe.so', '**/libproot_probe_loader.so', '**/libproot_probe_control.so']
    def verifyProbe = tasks.register('verifyProotProbeProvider', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/verify_android_proot_probe.py', '--provider', provider.absolutePath
    }
    tasks.named('preBuild').configure { dependsOn verifyProbe }
}
