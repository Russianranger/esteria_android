// Optional measured KGSL driver. Packaging never selects it or enables gameplay.
def turnipProvider = providers.gradleProperty('turnipProviderDir').orNull
def turnipPinFile = rootProject.file('runtime/turnip/android-provider.lock.json')
def turnipPin = new groovy.json.JsonSlurper().parse(turnipPinFile)
def turnipPinHash = java.security.MessageDigest.getInstance('SHA-256').digest(turnipPinFile.bytes).encodeHex().toString()
android.defaultConfig.buildConfigField 'boolean', 'TURNIP_PACKAGED', turnipProvider ? 'true' : 'false'
android.defaultConfig.buildConfigField 'String', 'TURNIP_REVISION', '"' + turnipPin.integrationRevision + '"'
android.defaultConfig.buildConfigField 'String', 'TURNIP_PIN', '"' + turnipPinHash + '"'
if (turnipProvider) {
    if (providers.gradleProperty('nativeBridgeAbi').getOrElse('arm64-v8a') != 'arm64-v8a' ||
        providers.gradleProperty('presentationEmulatorTest').getOrElse('false') == 'true' ||
        ['prootProbeProviderDir', 'mysqlProbeProviderDir', 'wineProbeProviderDir'].any { providers.gradleProperty(it).isPresent() })
        throw new GradleException('Turnip uses only the ARM64 runtime profile, separately from emulator fixtures')
    def provider = file(turnipProvider)
    android.sourceSets.main.assets.srcDir(new File(provider, 'assets'))
    android.androidResources.noCompress += ['archive']
    def verifyTurnip = tasks.register('verifyTurnipProvider', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/provider_turnip.py', 'verify', '--provider', provider.absolutePath
    }
    tasks.named('preBuild').configure { dependsOn verifyTurnip }
}

// Actual Java owner/lock fault injection only; host stubs never enter an APK.
def turnipProbeOwnerClasspath = files(providers.provider { android.bootClasspath },
    providers.provider { tasks.named('compileDebugJavaWithJavac').get().destinationDirectory.get().asFile },
    project(':core').layout.buildDirectory.dir('classes/java/main'))
def compileTurnipProbeOwner = tasks.register('compileTurnipProbeOwnerFixture', JavaCompile) {
    dependsOn 'compileDebugJavaWithJavac', ':core:classes'
    source file('src/test/java/io/github/russianranger/esteria/runtime/TurnipReadinessOwnerTests.java')
    source file('src/androidTest/java/io/github/russianranger/esteria/core/runtime/install/TurnipAdmissionReadFixture.java')
    source file('src/test/java/android/os/Looper.java')
    classpath = turnipProbeOwnerClasspath
    destinationDirectory = layout.buildDirectory.dir('turnipProbeOwnerFixture')
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
tasks.register('turnipProbeOwnerTest', JavaExec) {
    dependsOn compileTurnipProbeOwner
    classpath = files(compileTurnipProbeOwner.flatMap { it.destinationDirectory }) + turnipProbeOwnerClasspath
    mainClass = 'io.github.russianranger.esteria.runtime.TurnipReadinessOwnerTests'
    maxHeapSize = '32m'
}
