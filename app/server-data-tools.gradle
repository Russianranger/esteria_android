// Separate composed ordered-reader provider; never replace the stock profile implicitly.
def dataToolsProvider = providers.gradleProperty('serverDataToolsProviderDir').orNull
def dataToolsPinFile = rootProject.file('runtime/server/data-tools-provider.lock.json')
def dataToolsPin = new groovy.json.JsonSlurper().parse(dataToolsPinFile)
def dataToolsHash = java.security.MessageDigest.getInstance('SHA-256').digest(dataToolsPinFile.bytes).encodeHex().toString()
android.defaultConfig.buildConfigField 'boolean', 'SERVER_DATA_TOOLS_PACKAGED', dataToolsProvider ? 'true' : 'false'
android.defaultConfig.buildConfigField 'String', 'SERVER_DATA_TOOLS_PIN', '"' + dataToolsHash + '"'
if (dataToolsProvider) {
    if (providers.gradleProperty('serverExtractorsProviderDir').isPresent())
        throw new GradleException('Choose either stock extractors or the distinct composed data-tools provider')
    if (dataToolsPin.sourceCompanionComplete != true || dataToolsPin.actualOrderedSourceQualification == null ||
            dataToolsPin.nativeArgumentConfigQualified != true || dataToolsPin.archive == null)
        throw new GradleException('Data tools require actual complete ordered sources and derived native CLI qualification')
    if (providers.gradleProperty('nativeBridgeAbi').getOrElse('arm64-v8a') != 'arm64-v8a' ||
            providers.gradleProperty('presentationEmulatorTest').getOrElse('false') == 'true' ||
            ['prootProbeProviderDir','mysqlProbeProviderDir','wineProbeProviderDir'].any { providers.gradleProperty(it).isPresent() })
        throw new GradleException('Data tools require the production ARM64 profile')
    if (!providers.gradleProperty('serverRuntimeProviderDir').isPresent())
        throw new GradleException('Data tools require the verified Ubuntu ARM64 dependency provider')
    def provider = file(dataToolsProvider)
    android.sourceSets.main.assets.srcDir(new File(provider, 'assets'))
    android.androidResources.noCompress += ['archive']
    def verifier = tasks.register('verifyServerDataToolsProvider', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/provider_server_data_tools.py', 'verify', '--provider', provider.absolutePath
    }
    tasks.named('preBuild').configure { dependsOn verifier }
}
