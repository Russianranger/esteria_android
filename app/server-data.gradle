// Exact source-only closure; no executable provider or gameplay action enabled.
def serverDataHelpers = ['server-data-reader.sha256', 'server_data_generation.py', 'server_data_preflight.py',
    'shader_generation.py', 'extractor_order.py', 'owned_process_group.py', 'world_io.py']
def serverDataAssets = layout.buildDirectory.dir('generated/serverData')
def packageServerData = tasks.register('packageServerData') {
    inputs.files(serverDataHelpers.collect { rootProject.file('runtime/' + it) })
    outputs.dir(serverDataAssets)
    doLast {
        def directory = new File(serverDataAssets.get().asFile, 'server-data')
        delete directory
        directory.mkdirs()
        def records = new TreeMap()
        serverDataHelpers.each { name ->
            byte[] bytes = rootProject.file('runtime/' + name).bytes
            if (bytes.length == 0 || bytes.length > 131072) throw new GradleException('Unexpected server data helper size')
            new File(directory, name).bytes = bytes
            records[name] = [bytes: bytes.length, sha256: java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()]
        }
        new File(directory, 'manifest.json').text = groovy.json.JsonOutput.toJson([formatVersion: 1, files: records]) + '\n'
    }
}
android.sourceSets.main.assets.srcDir(serverDataAssets)
tasks.named('preBuild').configure { dependsOn packageServerData }

// Retained source-qualified operation owner, with actual importer/file locks.
// Controlled Java backends only; no tool/provider/Android execution is claimed.
def dataOwnerClasspath = files(providers.provider { android.bootClasspath },
    providers.provider { tasks.named('compileDebugJavaWithJavac').get().destinationDirectory.get().asFile },
    project(':core').layout.buildDirectory.dir('classes/java/main'))
def compileDataOwner = tasks.register('compileServerDataSetupOwnerFixture', JavaCompile) {
    dependsOn 'compileDebugJavaWithJavac', ':core:classes'
    source file('src/test/java/io/github/russianranger/esteria/runtime/ServerDataSetupOwnerTests.java')
    source file('src/test/java/android/os/Looper.java')
    classpath = dataOwnerClasspath
    destinationDirectory = layout.buildDirectory.dir('serverDataSetupOwnerFixture')
    sourceCompatibility = '17'; targetCompatibility = '17'
}
tasks.register('serverDataSetupOwnerTest', JavaExec) {
    dependsOn compileDataOwner
    classpath = files(compileDataOwner.flatMap { it.destinationDirectory }) + dataOwnerClasspath
    mainClass = 'io.github.russianranger.esteria.runtime.ServerDataSetupOwnerTests'
    maxHeapSize = '32m'
}

// Test APK only: Python's real producers supply receipt bytes and generation
// hashes. Android consumers must not manufacture their own expected hashes.
def pythonReceiptAssets = layout.buildDirectory.dir('generated/pythonReceiptFixtures')
def pythonReceiptHelpers = (serverDataHelpers + ['stock_content_inspection.py',
    'stock_shader_generation.py', 'stock_shader_translate.py']).unique()
def preparePythonReceipts = tasks.register('preparePythonReceiptFixtures', Exec) {
    inputs.file(rootProject.file('tools/prepare_android_receipt_fixtures.py'))
    inputs.file(rootProject.file('config/stock-prepared-data-reader.json'))
    inputs.file(rootProject.file('runtime/evidence/non-custom-v11-release-gates.json'))
    inputs.files(pythonReceiptHelpers.collect { rootProject.file('runtime/' + it) })
    outputs.dir(pythonReceiptAssets)
    doFirst { delete pythonReceiptAssets }
    commandLine 'python3', rootProject.file('tools/prepare_android_receipt_fixtures.py'),
        '--output', pythonReceiptAssets.map { it.dir('python-receipts').asFile }.get()
}
android.sourceSets.androidTest.assets.srcDir(pythonReceiptAssets)
tasks.matching { it.name == 'preDebugAndroidTestBuild' }.configureEach {
    dependsOn preparePythonReceipts
}

// Host executes the production shader receipt consumer, with actual AOSP JSON
// implementations ahead of the SDK stubs. No substitute serializer is used.
def compileShaderIntegrity = tasks.register('compileShaderPreparedIntegrityFixture', JavaCompile) {
    dependsOn 'compileDebugJavaWithJavac', ':core:classes'
    source file('src/test/java/io/github/russianranger/esteria/runtime/ShaderPreparedIntegrityTests.java')
    source file('src/test/java/io/github/russianranger/esteria/runtime/RendererCompatibilityTests.java')
    source rootProject.fileTree('tests/fixtures/android13-json/aosp') { include '*.java' }
    source rootProject.fileTree('tests/fixtures/android13-json/support') { include '*.java' }
    classpath = dataOwnerClasspath
    destinationDirectory = layout.buildDirectory.dir('shaderPreparedIntegrityFixture')
    sourceCompatibility = '17'; targetCompatibility = '17'
}
tasks.register('shaderPreparedIntegrityTest', JavaExec) {
    dependsOn compileShaderIntegrity, preparePythonReceipts
    classpath = files(compileShaderIntegrity.flatMap { it.destinationDirectory }) + dataOwnerClasspath
    mainClass = 'io.github.russianranger.esteria.runtime.ShaderPreparedIntegrityTests'
    args pythonReceiptAssets.map { it.dir('python-receipts').asFile }.get(), rootProject.file('runtime')
    maxHeapSize = '32m'
}
