plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.register('hostTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.russianranger.esteria.core.runtime.SessionSupervisorTest'
}
tasks.register('diagnosticsTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.russianranger.esteria.core.diagnostics.SupportBundleTest'
}
tasks.register('importerTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.russianranger.esteria.core.importer.ImporterTests'
    maxHeapSize = '32m'
}
check.dependsOn hostTest, diagnosticsTest, importerTest

tasks.register('runtimeInstallerTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.russianranger.esteria.core.runtime.install.RuntimeInstallerTests'
    maxHeapSize = '64m'
}
check.dependsOn runtimeInstallerTest

tasks.register('gameInputTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.russianranger.esteria.core.input.GameInputRouterTest'
    maxHeapSize = '32m'
}
check.dependsOn gameInputTest

tasks.register('presentationProtocolTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.russianranger.esteria.core.presentation.PcmProtocolTests'
    maxHeapSize = '32m'
}
check.dependsOn presentationProtocolTest
