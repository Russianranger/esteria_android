name: Restore the original Temurin JDK and Gradle wrapper distribution
description: Use checked upstream release assets on clean Linux x64 CI runners
inputs:
  read_token:
    description: Read-only GitHub release access
    required: true
runs:
  using: composite
  steps:
    - id: temurin
      continue-on-error: true
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17.0.13+11'
    - if: steps.temurin.outcome == 'failure'
      shell: bash
      env:
        RELEASE_READ_TOKEN: ${{ inputs.read_token }}
      run: |
        set -euo pipefail
        test "$(uname -m)" = x86_64
        work=$(mktemp -d "$RUNNER_TEMP/temurin-17.XXXXXXXX")
        archive="$work/temurin.tar.gz"
        curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 \
          -H 'Accept: application/octet-stream' -H "Authorization: Bearer $RELEASE_READ_TOKEN" \
          "https://api.github.com/repos/adoptium/temurin17-binaries/releases/assets/199843869?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$archive"
        unset RELEASE_READ_TOKEN
        test "$(stat -c %s "$archive")" = 191867538
        echo "8682892fc02965930b9022c066fa164dd6f458ef4a5dc262016aa28333b30f49  $archive" | sha256sum -c
        tar -xzf "$archive" -C "$work"
        jdk="$work/jdk-17.0.13+11"
        grep -Fx 'IMPLEMENTOR_VERSION="Temurin-17.0.13+11"' "$jdk/release"
        test -x "$jdk/bin/javac"
        echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
        echo "$jdk/bin" >> "$GITHUB_PATH"
    - shell: bash
      env:
        RELEASE_READ_TOKEN: ${{ inputs.read_token }}
      run: |
        set -euo pipefail
        # Standard wrapper directory for the exact distributionUrl below. Gradle
        # still checks distributionSha256Sum during normal wrapper installation.
        properties=gradle/wrapper/gradle-wrapper.properties
        grep -Fx 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip' "$properties"
        digest=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
        grep -Fx "distributionSha256Sum=$digest" "$properties"
        dir="${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists/gradle-8.9-bin/90cnw93cvbtalezasaz0blq0a"
        mkdir -p "$dir"
        archive=$(mktemp "$dir/gradle-8.9.XXXXXXXX")
        trap 'rm -f -- "$archive"' EXIT
        curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 \
          -H 'Accept: application/octet-stream' -H "Authorization: Bearer $RELEASE_READ_TOKEN" \
          "https://api.github.com/repos/gradle/gradle-distributions/releases/assets/178998845?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$archive"
        unset RELEASE_READ_TOKEN
        test "$(stat -c %s "$archive")" = 136114148
        echo "$digest  $archive" | sha256sum -c
        mv -- "$archive" "$dir/gradle-8.9-bin.zip"
