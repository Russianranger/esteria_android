name: Verify signed stock APK replacement on Android 13
description: Install the published baseline, create disposable app-owned fixtures and update in place.
runs:
  using: composite
  steps:
    - name: Configure KVM for the clean emulator and fetch the exact published baseline
      shell: bash
      run: |
        test -c /dev/kvm
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        baseline=$(python3 -c 'import json; print(json.load(open("app/stock-signing.lock.json"))["lastPublished"]["versionCode"])')
        curl --fail --location --retry 3 --max-time 600 "https://github.com/Russianranger/esteria_android/releases/download/non-custom-v0.1.0-non-custom.$baseline/Esteria-Stock-3.3.5a-arm64.apk" -o "$RUNNER_TEMP/signed-stock-baseline.apk"
    - name: Exercise Android Package Manager on the public APKs
      uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
      with:
        api-level: 33
        arch: x86_64
        target: google_apis
        cores: 2
        ram-size: 2048M
        heap-size: 256M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        disable-animations: true
        script: python3 tools/qualify_signed_stock_update.py
