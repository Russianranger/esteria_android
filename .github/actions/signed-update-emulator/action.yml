name: Verify signed stock APK replacement on Android 13
description: Install the published baseline, create disposable app-owned fixtures and update in place.
runs:
  using: composite
  steps:
    - name: Configure KVM for the clean emulator and fetch the exact published baseline
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test -c /dev/kvm
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        lock=app/stock-signing.lock.json
        baseline=$(jq -er '.lastPublished.versionCode' "$lock")
        expected=$(jq -er '.lastPublished.apkSha256' "$lock")
        asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/non-custom-v0.1.0-non-custom.$baseline" |
          jq -er --arg digest "sha256:$expected" '[.assets[] | select(.name == "Esteria-Stock-3.3.5a-arm64.apk" and .digest == $digest)]
            | select(length == 1) | .[0].id')
        curl --fail --location --silent --show-error --retry 3 --max-time 600 \
          -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
          -o "$RUNNER_TEMP/signed-stock-baseline.apk"
        echo "$expected  $RUNNER_TEMP/signed-stock-baseline.apk" | sha256sum -c
    - name: Exercise Android Package Manager on the public APKs
      uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
      with:
        api-level: 33
        arch: x86_64
        target: google_apis
        cores: 2
        ram-size: 2048M
        heap-size: 256M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        disable-animations: true
        script: python3 tools/qualify_signed_stock_update.py
