name: Recover byte-identical qualified server source retention
on:
  workflow_dispatch:
  push:
    branches: [android/client-server]
    paths:
      - .github/workflows/server-source-recovery.yml
      - tools/recover_server_source_retention.py
      - runtime/server/isolated-source-recovery.lock.json
      - tests/test_server_source_recovery.py
permissions:
  contents: read
  actions: read
concurrency:
  group: recover-server-source-retention-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover-original-source:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check recovery refusal and exact original recipe gates
        run: |
          test "$(uname -m)" = aarch64
          python3 -m unittest tests.test_server_source_recovery -v
          mkdir -p out/source-recovery-evidence
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 23f727a46de8c95ebca7fc698f6c82028c0ce033
          path: out/recovery-integration
          persist-credentials: false
      - name: Acquire exact original successful build proof and retained replay inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/recover_server_source_retention.py acquire --output out/source-recovery-proof \
            > out/source-recovery-evidence/original-proof.json
          python3 out/recovery-integration/tools/prepare_server_isolated_build.py acquire \
            --output out/isolated-inputs > out/source-recovery-evidence/input-acquisition.json
          python3 out/recovery-integration/tools/prepare_server_isolated_build.py protocol \
            --output out/protocol-reference > out/source-recovery-evidence/protocol-inputs.json
      - name: Install exact relevant native dependencies and regenerate original source preparation
        run: |
          mapfile -t packages < <(python3 out/recovery-integration/tools/prepare_server_isolated_build.py packages)
          test "${#packages[@]}" = 10
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y "${packages[@]}"
          python3 out/recovery-integration/tools/prepare_server_isolated_sources.py \
            --source-inputs out/isolated-inputs/source-inputs --supplements out/isolated-inputs/supplements \
            --output out/isolated-tree > out/source-recovery-evidence/preparation.json
      - name: Configure only and require every original member and compressed archive hash
        id: recovery
        run: |
          sudo env PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 CCACHE_DISABLE=1 \
            unshare --net -- sh -c 'ip link set lo up; exec "$@"' sh \
            python3 tools/recover_server_source_retention.py recover \
            --workspace "$GITHUB_WORKSPACE" --integration "$GITHUB_WORKSPACE/out/recovery-integration" \
            --evidence "$GITHUB_WORKSPACE/out/source-recovery-proof" \
            --output "$GITHUB_WORKSPACE/out/recovered-server-sources" \
            > out/source-recovery-evidence/recovery.log 2>&1
      - name: Collect bounded recovery diagnostics without rewriting original receipts
        if: always()
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('out/source-recovery-evidence');target.mkdir(parents=True,exist_ok=True)
          source=Path('out/isolated-rebuild/diagnostics')
          if source.is_dir():
              for path in source.iterdir():
                  if path.is_file() and path.stat().st_size<=1024**2:shutil.copyfile(path,target/path.name)
          receipt=Path('out/recovered-server-sources/retention-recovery-receipt.json')
          if receipt.is_file():shutil.copyfile(receipt,target/receipt.name)
          PY
          sudo chown -R "$(id -u):$(id -g)" out/source-recovery-evidence
          if sudo test -d out/recovered-server-sources; then
            sudo chown -R "$(id -u):$(id -g)" out/recovered-server-sources
          fi
      - name: Retain only the exact already-qualified source archive and unchanged original receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.recovery.outcome == 'success'
        with:
          name: recovered-original-qualified-server-sources-${{ github.sha }}
          compression-level: 0
          path: out/recovered-server-sources/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: server-source-retention-recovery-evidence-${{ github.sha }}
          path: out/source-recovery-evidence/
          retention-days: 30
          if-no-files-found: error
