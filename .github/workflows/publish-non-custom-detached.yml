name: Publish exact stock APK with detached public signature
on:
  workflow_dispatch:
  push:
    branches: [non-custom]
    paths:
      - runtime/releases/non-custom/**
      - tools/publish_detached_non_custom.py
      - tools/export_apk_signature.py
      - .github/workflows/publish-non-custom-detached.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-detached-non-custom
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/non-custom' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish detached non-custom]') || contains(github.event.head_commit.message, '[stage detached non-custom]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: temurin
        continue-on-error: true
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Recover the same Temurin JDK from the original release asset
        if: steps.temurin.outcome == 'failure'
        env:
          RELEASE_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          work=$(mktemp -d "$RUNNER_TEMP/temurin-17.XXXXXXXX")
          archive="$work/temurin.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 \
            -H 'Accept: application/octet-stream' -H "Authorization: Bearer $RELEASE_READ_TOKEN" \
            "https://api.github.com/repos/adoptium/temurin17-binaries/releases/assets/199843869?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o "$archive"
          unset RELEASE_READ_TOKEN
          test "$(stat -c %s "$archive")" = 191867538
          echo "8682892fc02965930b9022c066fa164dd6f458ef4a5dc262016aa28333b30f49  $archive" | sha256sum -c
          tar -xzf "$archive" -C "$work"
          jdk="$work/jdk-17.0.13+11"
          grep -Fx 'IMPLEMENTOR_VERSION="Temurin-17.0.13+11"' "$jdk/release"
          test -x "$jdk/bin/javac"
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
      - name: Install exact Android SDK tools for independent signature and manifest readback
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/detached-publication-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --max-time 600 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/detached-android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/detached-android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/detached-android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          (set +o pipefail; yes | "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Check detached signature and fixed producer provenance guards
        run: |
          python3 -m py_compile tools/export_apk_signature.py tools/publish_detached_non_custom.py
          python3 -m unittest tests.test_detached_non_custom_publication -v
      - name: Verify exact package and native SQL evidence, reconstruct and independently verify, publish additively
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stage detached non-custom]') }}
        run: |
          options=()
          if [[ "$STAGE_ONLY" != true ]]; then options+=(--publish); fi
          python3 tools/publish_detached_non_custom.py --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --output out/detached-publication "${options[@]}"
      - name: Stage the signed candidate and observation-only DEX for native package replacement
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[stage detached non-custom]')
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35'
          bash tools/retained_database/compile.sh "$RUNNER_TEMP/retained-observer"
          mkdir -p out/signed-update-input
          cp "$RUNNER_TEMP/retained-observer/observer.jar" out/signed-update-input/
          cp out/detached-publication/release/Esteria-Stock-3.3.5a-arm64.apk out/signed-update-input/candidate.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[stage detached non-custom]')
        with:
          name: signed-retained-update-input
          path: out/signed-update-input/
          compression-level: 0
          retention-days: 3
      - name: Test this staged signed update on a disposable Android 13 emulator
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[stage detached non-custom]')
        uses: ./.github/actions/signed-update-emulator
      - name: Retain public provenance and signing evidence without private key material
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: detached-stock-publication-${{ github.sha }}
          path: |
            out/detached-publication/publication-evidence.json
            out/detached-publication/signed-update-android13.json
            out/detached-publication/publication-draft.json
            out/detached-publication/published-release.json
            out/detached-publication/release/release.json
            out/detached-publication/signed/signing-receipt.json
          if-no-files-found: warn
          retention-days: 30

  signed-retained-android:
    if: always() && !cancelled() && github.event_name == 'push' && contains(github.event.head_commit.message, '[stage detached non-custom]')
    needs: publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e9553fe7f0035a3336693046368c6ad7034ab344
          path: previous-qa
          sparse-checkout: tools/android_stock_shader
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-retained-update-input
          path: signed-input
      - name: Exercise the original v19 failure and signed replacement on offline Android 13 ARM64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source previous-qa/tools/android_stock_shader/redroid.sh
          work=$(mktemp -d "$RUNNER_TEMP/signed-retained.XXXXXXXX")
          mkdir -p "$work/input" evidence
          cp signed-input/* "$work/input/"
          for asset in '723482619 previous.apk' '692421785 wine.tar.gz'; do
            read -r id name <<< "$asset"
            curl --fail --location --silent --show-error --retry 3 --max-time 600               -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream'               "https://api.github.com/repos/Russianranger/esteria_android/releases/assets/$id?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$work/input/$name"
          done
          unset GH_TOKEN
          echo "c0d251847496c64170bb31d534a925afd1d8e7f92c21687e0e1cbf82c056e6fa  $work/input/previous.apk" | sha256sum -c
          wine=$(jq -r '.packages["wine-arm64"].archive.sha256' runtime/runtime-sources.lock.json)
          echo "$wine  $work/input/wine.tar.gz" | sha256sum -c
          chmod 755 "$work/input"
          chmod 644 "$work/input/"*
          trap 'redroid_stop "$work"' EXIT
          redroid_start "$work"
          python3 tools/retained_database/device.py evidence/signed-update.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signed-retained-android-arm64
          path: evidence/*.jsonl
          retention-days: 14
          if-no-files-found: warn
