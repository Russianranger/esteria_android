name: Pinned local-server build
on:
  push:
    branches: [android/client-server]
    paths:
      - sources.lock.json
      - tools/fetch_sources.py
      - tools/verify_protocol.py
      - tools/manifest_server_content.py
      - tools/manifest_server_modules.py
      - tools/package_server_content.py
      - tools/qualify_dbimport.py
      - tools/qualify_authserver.py
      - tools/auth_protocol.py
      - tests/test_auth_protocol.py
      - tests/test_authserver_qualification.py
      - tests/auth_srp_reference.cpp
      - tests/test_dbimport_qualification.py
      - tests/test_server_adaptations.py
      - tests/test_empty_script_modules.py
      - tools/qualify_base_sql.py
      - tools/render_server_config.py
      - runtime/mysql_bootstrap.py
      - runtime/provision_local_realm.py
      - runtime/provision_local_account.py
      - tests/test_local_account.py
      - tests/srp6_reference.cpp
      - tests/srp6_reference.cmake
      - runtime/server/**
      - runtime/server-lua-map.json
      - tests/native/**
      - tools/verify_server_build.py
      - tests/test_server_build.py
      - patches/server/**
      - .github/workflows/server.yml
  pull_request:
    paths:
      - sources.lock.json
      - tools/fetch_sources.py
      - tools/verify_protocol.py
      - tools/manifest_server_content.py
      - tools/manifest_server_modules.py
      - tools/package_server_content.py
      - tools/qualify_dbimport.py
      - tools/qualify_authserver.py
      - tools/auth_protocol.py
      - tests/test_auth_protocol.py
      - tests/test_authserver_qualification.py
      - tests/auth_srp_reference.cpp
      - tests/test_dbimport_qualification.py
      - tests/test_server_adaptations.py
      - tests/test_empty_script_modules.py
      - tools/qualify_base_sql.py
      - tools/render_server_config.py
      - runtime/mysql_bootstrap.py
      - runtime/provision_local_realm.py
      - runtime/provision_local_account.py
      - tests/test_local_account.py
      - tests/srp6_reference.cpp
      - tests/srp6_reference.cmake
      - runtime/server/**
      - runtime/server-lua-map.json
      - tests/native/**
      - tools/verify_server_build.py
      - tests/test_server_build.py
      - patches/server/**
      - .github/workflows/server.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false
jobs:
  server:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-server
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          mkdir -p out/diagnostics
          sudo apt-get update
          sudo apt-get install -y binutils ccache cmake ninja-build g++ libboost-all-dev libssl-dev libmysqlclient-dev mysql-client libreadline-dev libbz2-dev zlib1g-dev
          dpkg-query -W > out/diagnostics/build-packages.txt
          uname -a > out/diagnostics/build-host.txt
      - name: Identify exact cache environment and source inputs
        id: cache-identity
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform, shutil, subprocess
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          compiler = pathlib.Path(shutil.which('g++')).resolve()
          environment = {
              'platform': platform.machine(),
              'os': pathlib.Path('/etc/os-release').read_text(),
              'packages': pathlib.Path('out/diagnostics/build-packages.txt').read_text(),
              'compiler_sha256': digest(compiler.read_bytes()),
              'compiler_version': subprocess.check_output(['g++', '--version'], text=True),
              'compiler_target': subprocess.check_output(['g++', '-dumpmachine'], text=True),
              'cmake_version': subprocess.check_output(['cmake', '--version'], text=True),
              'ccache_version': subprocess.check_output(['ccache', '--version'], text=True),
          }
          source = json.loads(pathlib.Path('sources.lock.json').read_text())['sources']['server']
          env_hash = digest(json.dumps(environment, sort_keys=True).encode())
          patch_hash = digest(json.dumps({'submodules': source['submodules'], 'patches': source['patches']},
                                        sort_keys=True).encode())
          pathlib.Path('out/diagnostics/cache-environment.json').write_text(json.dumps(environment, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('environment=' + env_hash + '\nsource=' + source['commit'] + '\npatches=' + patch_hash + '\n')
      - name: Restore compiler cache only from the same toolchain environment
        id: cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: server-ccache-v1-${{ steps.cache-identity.outputs.environment }}-${{ steps.cache-identity.outputs.source }}-${{ steps.cache-identity.outputs.patches }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            server-ccache-v1-${{ steps.cache-identity.outputs.environment }}-${{ steps.cache-identity.outputs.source }}-${{ steps.cache-identity.outputs.patches }}-
            server-ccache-v1-${{ steps.cache-identity.outputs.environment }}-
      - name: Configure bounded compiler cache
        run: |
          ccache --max-size=2G
          ccache --zero-stats
      - name: Prepare pinned sources
        run: python3 tools/fetch_sources.py all
      - name: Verify client and server field layouts
        run: python3 tools/verify_protocol.py --client sources/client --server sources/server
      - name: Compile the actual Eluna hook header without implicit precompiled includes
        run: >-
          g++ -std=c++20 -DELUNA_AZEROTHCORE -fsyntax-only
          -Isources/server/src/common -Isources/server/src/common/Platform
          -Isources/server/src/server/game/LuaEngine/hooks tests/native/eluna_hooks.cpp
      - name: Verify server artifact checker behavior
        run: python3 -m unittest tests.test_server_build tests.test_dbimport_qualification tests.test_server_adaptations tests.test_empty_script_modules tests.test_local_account tests.test_auth_protocol tests.test_authserver_qualification -v
      - name: Configure ARM64 server
        run: |
          set -o pipefail
          cmake -S sources/server -B out/server -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/out/server-install \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PROJECT_INCLUDE=${{ github.workspace }}/tests/srp6_reference.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSCRIPTS=static -DMODULES=static -DAPPS_BUILD=all -DTOOLS_BUILD=all \
            -DELUNA=ON -DLUA_VERSION=lua52 -DLUA_STATIC=ON -DNOPCH=1 \
            2>&1 | tee out/diagnostics/configure.log
      - name: Build with bounded concurrency
        id: compile
        run: |
          set -o pipefail
          cmake --build out/server --parallel 2 --target esteria_srp_reference esteria_auth_srp_reference \
            2>&1 | tee out/diagnostics/srp-reference-compile.log
          out/server/esteria_srp_reference > out/diagnostics/srp-reference.json
          ESTERIA_AUTH_SRP_REFERENCE="$GITHUB_WORKSPACE/out/server/esteria_auth_srp_reference" \
            python3 -m unittest tests.test_auth_protocol -v 2>&1 | tee out/diagnostics/auth-srp-reference.log
          cmake --build out/server --parallel 1 \
            --target modules/CMakeFiles/modules.dir/mod-attunement-plus/src/mod_attunement_plus.cpp.o \
            2>&1 | tee out/diagnostics/attunement-compile.log
          cmake --build out/server --parallel 2 \
            --target src/server/scripts/CMakeFiles/scripts.dir/Kalimdor/zone_moonglade.cpp.o \
                     src/server/scripts/CMakeFiles/scripts.dir/Northrend/zone_zuldrak.cpp.o \
                     src/server/scripts/CMakeFiles/scripts.dir/OutdoorPvP/OutdoorPvPNA.cpp.o \
            2>&1 | tee out/diagnostics/grid-script-compile.log
          cmake --build out/server --parallel 2 2>&1 | tee out/diagnostics/build.log
      - name: Record compiler cache evidence
        if: always() && steps.compile.outcome != 'skipped' && steps.cache-restore.outcome == 'success'
        run: ccache --show-stats > out/diagnostics/ccache-statistics.txt
      - name: Save partial compiler work after success or failure
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && steps.compile.outcome != 'skipped' && steps.cache-restore.outcome == 'success'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: server-ccache-v1-${{ steps.cache-identity.outputs.environment }}-${{ steps.cache-identity.outputs.source }}-${{ steps.cache-identity.outputs.patches }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install build-only binaries and preserve notices
        id: install
        run: |
          cmake --install out/server
          cp sources.lock.json out/server-install/
          mkdir -p out/server-install/notices/EsteriaWoW
          cp sources/server/LICENSE sources/server/AUTHORS out/server-install/notices/EsteriaWoW/
          uname -a > out/server-install/build-host.txt
          dpkg-query -W > out/server-install/build-packages.txt
      - name: Verify ARM64 artifacts and source-confirmed host loader smoke
        id: verify-artifacts
        run: |
          set -o pipefail
          python3 tools/verify_server_build.py \
            --install out/server-install --server sources/server \
            --cmake-cache out/server/CMakeCache.txt \
            --packages out/server-install/build-packages.txt \
            --host out/server-install/build-host.txt \
            --revision "${GITHUB_SHA}" --build-id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --loader-smoke 2>&1 | tee out/diagnostics/artifact-verification.log
      - name: Bind generated module lists to the verified binaries
        run: |
          python3 tools/manifest_server_modules.py \
            --compile-commands out/server/compile_commands.json --install out/server-install \
            --server-build out/server-install/server-build.json --output out/server-modules.json
          python3 - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path('out/server-modules.json').read_text())
          pathlib.Path('out/server-enabled-modules.json').write_text(json.dumps(manifest['enabledModules']))
          PY
      - name: Package verified SQL and notices with explicit Lua policy
        run: |
          python3 tools/manifest_server_content.py --server sources/server \
            --modules-json out/server-enabled-modules.json --output out/server-content-manifest.json
          python3 tools/package_server_content.py --server sources/server \
            --manifest out/server-content-manifest.json --module-receipt out/server-modules.json \
            --lua-map runtime/server-lua-map.json --output out/server-content
      - name: Retain unqualified content package and exact module evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unqualified-esteria-server-content-${{ github.sha }}
          compression-level: 0
          path: |
            out/server-content/
            out/server-modules.json
            out/server-content-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Build pinned MySQL dependencies for compiled updater qualification
        run: |
          mkdir -p out/dbimport-evidence out/dbimport-private
          docker build --platform linux/arm64 --target runtime \
            --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt \
            -t esteria-dbimport:qualification runtime/server \
            > out/dbimport-evidence/image-build.log 2>&1
          container=$(docker create esteria-dbimport:qualification)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/etc/esteria-server-runtime.json" out/dbimport-evidence/server-runtime.json
          docker image inspect esteria-dbimport:qualification --format '{{.Id}}' > out/dbimport-evidence/image-id.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          runtime = json.loads(pathlib.Path('out/dbimport-evidence/server-runtime.json').read_text())
          digest = hashlib.sha256(pathlib.Path('out/server-content/package-receipt.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ESTERIA_DBIMPORT_MYSQL_VERSION=' + runtime['expectedMysqlSqlVersion'] + '\n')
              output.write('ESTERIA_DBIMPORT_CONTENT_SHA256=' + digest + '\n')
          PY
      - name: Qualify compiled updater and owned loopback authentication without external network
        run: |
          docker run --rm --init --network none \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/qualification,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/dbimport-private,dst=/state" \
            --workdir /qualification esteria-dbimport:qualification \
            python3 tools/qualify_authserver.py \
            --install /qualification/out/server-install --content /qualification/out/server-content \
            --content-receipt-sha256 "$ESTERIA_DBIMPORT_CONTENT_SHA256" \
            --mysql /usr/bin/mysql --mysqld /usr/sbin/mysqld \
            --expected-version "$ESTERIA_DBIMPORT_MYSQL_VERSION" --output /state/run \
            > out/dbimport-evidence/qualification.log 2>&1
      - name: Collect compiled updater receipts and bounded redacted diagnostics only
        if: always() && steps.verify-artifacts.outcome == 'success'
        run: |
          mkdir -p out/dbimport-evidence
          sudo python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          source = pathlib.Path('out/dbimport-private/run')
          target = pathlib.Path('out/dbimport-evidence')
          names = ['qualification.json', 'mysql-initialize-engine.log', 'mysql-bootstrap-engine.log',
                   'mysql-base-engine.log', 'mysql-base-restart-engine.log',
                   'dbimport-first.log', 'dbimport-second.log', 'auth-qualification.json', 'authserver-redacted.log']
          for name in names:
              path = source / name
              if path.is_file():
                  shutil.copyfile(path, target / name)
          receipt = target / 'qualification.json'
          runtime = target / 'server-runtime.json'
          if receipt.is_file() and runtime.is_file():
              metadata = dict(formatVersion=1, scope='native-arm64-disposable-compiled-dbimport',
                  qualificationSha256=hashlib.sha256(receipt.read_bytes()).hexdigest(),
                  runtimeManifestSha256=hashlib.sha256(runtime.read_bytes()).hexdigest(),
                  externalNetworkDisabled=True, existingSaveUpgradesQualified=False,
                  playerbotsRuntimeQualified=False, androidRuntimeQualified=False, gameplayQualified=False)
              (target / 'environment-receipt.json').write_text(json.dumps(metadata, indent=2) + '\n')
              auth = target / 'auth-qualification.json'
              if auth.is_file():
                  metadata = dict(formatVersion=1, scope='native-arm64-disposable-auth-protocol-probe',
                      qualificationSha256=hashlib.sha256(auth.read_bytes()).hexdigest(),
                      runtimeManifestSha256=hashlib.sha256(runtime.read_bytes()).hexdigest(),
                      externalNetworkDisabled=True, reconstructedClientExecuted=False,
                      worldEntryQualified=False, androidRuntimeQualified=False, gameplayQualified=False)
                  (target / 'auth-environment-receipt.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          sudo chown -R "$(id -u):$(id -g)" out/dbimport-evidence
      - name: Retain compiled updater qualification evidence
        if: always() && steps.verify-artifacts.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbimport-qualification-${{ github.sha }}
          path: out/dbimport-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Retain installed unqualified binaries even when verification fails
        if: always() && steps.install.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unqualified-esteria-linux-arm64-server-${{ github.sha }}
          path: |
            out/server-install/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build diagnostics on failure or success
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: esteria-linux-arm64-server-diagnostics-${{ github.sha }}
          path: |
            out/diagnostics/
            out/server/CMakeCache.txt
            out/server/compile_commands.json
            out/server/CMakeFiles/CMakeConfigureLog.yaml
            out/server/.ninja_log
            sources.lock.json
            patches/server/
          if-no-files-found: warn
          retention-days: 14
