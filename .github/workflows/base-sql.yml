name: Pinned server base SQL qualification
on:
  push:
    branches: [android/client-server]
    paths:
      - sources.lock.json
      - patches/server/**
      - tools/qualify_base_sql.py
      - tools/qualify_local_account.py
      - tools/qualify_mysql_backup.py
      - tools/manifest_server_content.py
      - tools/package_server_content.py
      - runtime/mysql_bootstrap.py
      - runtime/android_database_setup.py
      - runtime/mysql-backup-tools.lock.json
      - runtime/provision_local_account.py
      - runtime/provision_local_realm.py
      - tools/render_server_config.py
      - config/local-server.json
      - runtime/server/**
      - tests/test_server_dependency_image.py
      - tools/verify_server_dependency_image.py
      - tools/prepare_server_dependency_image.py
      - tools/release_server_dependencies.py
      - tests/test_base_sql.py
      - tests/test_local_account.py
      - tests/test_local_account_qualification.py
      - tests/test_mysql_backup.py
      - tests/test_android_database_setup.py
      - tests/fixtures/*-f35f04d.sql
      - .github/workflows/base-sql.yml
  pull_request:
    paths:
      - sources.lock.json
      - patches/server/**
      - tools/qualify_base_sql.py
      - tools/qualify_local_account.py
      - tools/qualify_mysql_backup.py
      - tools/manifest_server_content.py
      - tools/package_server_content.py
      - runtime/mysql_bootstrap.py
      - runtime/android_database_setup.py
      - runtime/mysql-backup-tools.lock.json
      - runtime/provision_local_account.py
      - runtime/provision_local_realm.py
      - runtime/server/**
      - tests/test_server_dependency_image.py
      - tools/verify_server_dependency_image.py
      - tools/prepare_server_dependency_image.py
      - tools/release_server_dependencies.py
      - tools/render_server_config.py
      - config/local-server.json
      - tests/test_base_sql.py
      - tests/test_local_account.py
      - tests/test_local_account_qualification.py
      - tests/test_mysql_backup.py
      - tests/test_android_database_setup.py
      - tests/fixtures/*-f35f04d.sql
      - .github/workflows/base-sql.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base-sql-${{ github.ref }}
  cancel-in-progress: false
jobs:
  base-schemas:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check source and fresh-fixture safety contracts
        run: |
          test "$(uname -m)" = aarch64
          python3 -m unittest tests.test_base_sql tests.test_server_runtime_inputs tests.test_local_account tests.test_local_account_qualification tests.test_mysql_backup tests.test_android_database_setup tests.test_server_dependency_image -v
          mkdir -p out/base-sql-evidence out/base-sql-private out/local-account-evidence out/local-account-private out/mysql-backup-evidence out/mysql-backup-private
      - name: Fetch the exact server Git tree and stage only authenticated base SQL
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          source = json.loads(pathlib.Path('sources.lock.json').read_text())['sources']['server']
          root = pathlib.Path('out/base-sql-source')
          subprocess.run(['git', 'init', str(root)], check=True)
          subprocess.run(['git', '-C', str(root), 'remote', 'add', 'origin', source['url']], check=True)
          subprocess.run(['git', '-C', str(root), 'fetch', '--depth', '1', '--filter=blob:none',
                          'origin', source['commit']], check=True)
          PY
          python3 tools/qualify_base_sql.py prepare --server out/base-sql-source \
            --output out/base-sql-fixture --allow-source-fetch
          python3 tools/qualify_local_account.py prepare --server out/base-sql-source \
            --output out/local-account-fixture --allow-source-fetch
          python3 - <<'PY'
          import hashlib, os, pathlib
          digest = hashlib.sha256(pathlib.Path('out/base-sql-fixture/base-fixture.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ESTERIA_BASE_FIXTURE_SHA256=' + digest + '\n')
              output.write('ESTERIA_ACCOUNT_FIXTURE_SHA256=' + hashlib.sha256(pathlib.Path('out/local-account-fixture/account-fixture.json').read_bytes()).hexdigest() + '\n')
          PY
      - name: Prepare and read back the exact published dependency image without APT
        run: |
          env -u GITHUB_TOKEN python3 tools/release_server_dependencies.py prepare --output out/base-sql-dependency-release \
            > out/base-sql-evidence/dependency-download.log 2>&1
          python3 tools/prepare_server_dependency_image.py --inputs out/base-sql-dependency-release \
            --output out/base-sql-dependency-image > out/base-sql-evidence/dependency-context.log 2>&1
          cp out/base-sql-dependency-image/context-receipt.json out/base-sql-evidence/dependency-context.json
          cp out/base-sql-dependency-release/server-runtime.json out/base-sql-evidence/server-runtime.json
          rm -rf out/base-sql-dependency-release
          docker build --network none --platform linux/arm64 -t esteria-base-sql:qualification \
            out/base-sql-dependency-image/context > out/base-sql-evidence/image-build.log 2>&1
          docker image inspect esteria-base-sql:qualification --format '{{.Id}}' > out/base-sql-evidence/image-id.txt
          docker run --rm --network none --read-only \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tools/verify_server_dependency_image.py,dst=/verify-image.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/base-sql-dependency-image/context-receipt.json,dst=/context-receipt.json,readonly" \
            esteria-base-sql:qualification /usr/bin/python3 /verify-image.py --context-receipt /context-receipt.json \
            > out/base-sql-evidence/dependency-image-check.json
          python3 - <<'PY'
          import json, os, pathlib
          check = json.loads(pathlib.Path('out/base-sql-evidence/dependency-image-check.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ESTERIA_MYSQL_SQL_VERSION=' + check['expectedMysqlSqlVersion'] + '\n')
          PY
      - name: Import authentic source bases and test restart persistence with external network disabled
        run: |
          docker run --rm --init --network none \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/qualification,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/base-sql-fixture,dst=/fixture,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/base-sql-private,dst=/state" \
            --workdir /qualification esteria-base-sql:qualification \
            python3 tools/qualify_base_sql.py qualify --fixture /fixture \
            --fixture-sha256 "$ESTERIA_BASE_FIXTURE_SHA256" \
            --mysql /usr/bin/mysql --mysqld /usr/sbin/mysqld \
            --expected-version "$ESTERIA_MYSQL_SQL_VERSION" --output /state/run \
            > out/base-sql-evidence/qualification.log 2>&1
      - name: Qualify one owned account in a separate new MySQL instance without external network
        run: |
          docker run --rm --init --network none \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/qualification,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/local-account-fixture,dst=/fixture,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/local-account-private,dst=/state" \
            --workdir /qualification esteria-base-sql:qualification \
            python3 tools/qualify_local_account.py qualify --fixture /fixture \
            --fixture-sha256 "$ESTERIA_ACCOUNT_FIXTURE_SHA256" \
            --mysql /usr/bin/mysql --mysqld /usr/sbin/mysqld \
            --expected-version "$ESTERIA_MYSQL_SQL_VERSION" --output /state/run \
            > out/local-account-evidence/qualification.log 2>&1
      - name: Qualify private four-database backup and fresh restore without external network
        run: |
          docker run --rm --init --network none \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/qualification,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/base-sql-fixture,dst=/fixture,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/local-account-fixture,dst=/account-fixture,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/mysql-backup-private,dst=/state" \
            --workdir /qualification esteria-base-sql:qualification \
            python3 tools/qualify_mysql_backup.py --fixture /fixture \
            --fixture-sha256 "$ESTERIA_BASE_FIXTURE_SHA256" \
            --account-fixture /account-fixture --account-fixture-sha256 "$ESTERIA_ACCOUNT_FIXTURE_SHA256" \
            --expected-version "$ESTERIA_MYSQL_SQL_VERSION" --output /state/run \
            > out/mysql-backup-evidence/qualification.log 2>&1
      - name: Collect receipts and bounded redacted diagnostics only
        if: always()
        run: |
          sudo python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          source = pathlib.Path('out/base-sql-private/run')
          target = pathlib.Path('out/base-sql-evidence')
          names = ['qualification.json', 'sql-failure.txt', 'mysql-initialize-engine.log',
                   'mysql-bootstrap-engine.log', 'mysql-base-engine.log', 'mysql-base-restart-engine.log']
          for name in names:
              path = source / name
              if path.is_file():
                  shutil.copyfile(path, target / name)
          receipt = target / 'qualification.json'
          runtime = target / 'server-runtime.json'
          if receipt.is_file() and runtime.is_file():
              metadata = dict(formatVersion=1, scope='native-arm64-disposable-base-SQL',
                  qualificationSha256=hashlib.sha256(receipt.read_bytes()).hexdigest(),
                  runtimeManifestSha256=hashlib.sha256(runtime.read_bytes()).hexdigest(),
                  externalNetworkDisabled=True, compiledUpdaterExecuted=False,
                  existingSaveUpgradesQualified=False, androidRuntimeQualified=False, gameplayQualified=False)
              (target / 'environment-receipt.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          sudo chown -R "$(id -u):$(id -g)" out/base-sql-evidence
      - name: Collect account receipts and bounded engine diagnostics only
        if: always()
        run: |
          sudo python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          source = pathlib.Path('out/local-account-private/run')
          target = pathlib.Path('out/local-account-evidence')
          target.mkdir(parents=True, exist_ok=True)
          for name in ['qualification.json', 'mysql-initialize-engine.log', 'mysql-bootstrap-engine.log',
                       'mysql-base-engine.log', 'mysql-base-restart-engine.log']:
              path = source / name
              if path.is_file():
                  shutil.copyfile(path, target / name)
          runtime = pathlib.Path('out/base-sql-evidence/server-runtime.json')
          receipt = target / 'qualification.json'
          if receipt.is_file() and runtime.is_file():
              shutil.copyfile(runtime, target / runtime.name)
              metadata = dict(formatVersion=1, scope='native-arm64-disposable-owned-local-account',
                  qualificationSha256=hashlib.sha256(receipt.read_bytes()).hexdigest(),
                  runtimeManifestSha256=hashlib.sha256(runtime.read_bytes()).hexdigest(),
                  externalNetworkDisabled=True, compiledAuthserverExecuted=False,
                  authProtocolQualified=False, androidRuntimeQualified=False, gameplayQualified=False)
              (target / 'environment-receipt.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          sudo chown -R "$(id -u):$(id -g)" out/local-account-evidence
      - name: Collect backup qualification receipts only, never SQL or credentials
        if: always()
        run: |
          sudo python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          source = pathlib.Path('out/mysql-backup-private/run')
          target = pathlib.Path('out/mysql-backup-evidence')
          target.mkdir(parents=True, exist_ok=True)
          receipt = source / 'qualification.json'
          runtime = pathlib.Path('out/base-sql-evidence/server-runtime.json')
          if receipt.is_file():
              shutil.copyfile(receipt, target / receipt.name)
          if receipt.is_file() and runtime.is_file():
              shutil.copyfile(runtime, target / runtime.name)
              metadata = dict(formatVersion=1, scope='native-arm64-disposable-MySQL-backup',
                  qualificationSha256=hashlib.sha256(receipt.read_bytes()).hexdigest(),
                  runtimeManifestSha256=hashlib.sha256(runtime.read_bytes()).hexdigest(),
                  externalNetworkDisabled=True, existingSaveRestoreQualified=False,
                  schemaUpgradeQualified=False, androidRuntimeQualified=False, gameplayQualified=False)
              (target / 'environment-receipt.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          sudo chown -R "$(id -u):$(id -g)" out/mysql-backup-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: base-sql-qualification-${{ github.sha }}
          path: out/base-sql-evidence
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-account-qualification-${{ github.sha }}
          path: out/local-account-evidence
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mysql-backup-qualification-${{ github.sha }}
          path: out/mysql-backup-evidence
          retention-days: 14
          if-no-files-found: error
