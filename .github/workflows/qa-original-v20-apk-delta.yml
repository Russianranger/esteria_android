name: Compare public v19 and original v20 unsigned APK
on:
  push:
    branches: [qa/v20-original-apk-delta-869d5de]
permissions:
  actions: read
  contents: read
jobs:
  original-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 869d5de3c20596b314536bdb3fb3bf07176920b1
          persist-credentials: false
      - name: Acquire only the reviewed original package and published signed baseline
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          api=https://api.github.com/repos/Russianranger/esteria_android
          curl -fsSL --retry 3 -H "Authorization: Bearer $READ_TOKEN" "$api/actions/artifacts/13613428032/zip" -o package.zip
          curl -fsSL --retry 3 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $READ_TOKEN" "$api/releases/assets/723482619?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o v19.apk
          unset READ_TOKEN
          test "$(stat -c %s package.zip)" = 336906706
          test "$(stat -c %s v19.apk)" = 336899353
          echo '1aeadcc0dec370f2ef78e071b118a7390ec402f8986b4f9938fc013994b46ecb  package.zip' | sha256sum -c
          echo 'c0d251847496c64170bb31d534a925afd1d8e7f92c21687e0e1cbf82c056e6fa  v19.apk' | sha256sum -c
          unzip -p package.zip app/build/outputs/apk/release/app-release-unsigned.apk > v20.apk
      - name: Verify both SDK manifests, original signer and all asset/provider/native bytes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs v19.apk > baseline-sdk.txt
          test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' baseline-sdk.txt)" = 1
          grep -Fx 'Signer #1 certificate SHA-256 digest: 5e6921a036142cf2da217ddd17a3f7bb734706268e4ee913e2037da898b4d9fa' baseline-sdk.txt
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' baseline-sdk.txt
          grep -Fx 'Verified using v3 scheme (APK Signature Scheme v3): true' baseline-sdk.txt
          for version in 19 20; do
            "$tools/aapt" dump badging "v$version.apk" > "sdk-$version.txt"
            grep -F "name='io.github.russianranger.esteria.stock' versionCode='$version' versionName='0.1.0-non-custom.$version'" "sdk-$version.txt"
            grep -Fx "sdkVersion:'26'" "sdk-$version.txt"
            grep -Fx "targetSdkVersion:'35'" "sdk-$version.txt"
            if grep -q '^application-debuggable' "sdk-$version.txt"; then exit 1; fi
          done
          if "$tools/apksigner" verify v20.apk >/dev/null 2>&1; then exit 1; fi
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          def identity(stream):
              return hashlib.file_digest(stream,'sha256').hexdigest()
          def inventory(archive):
              entries={}
              for i in archive.infolist():
                  if i.is_dir() or not i.filename.startswith(('assets/','lib/')): continue
                  assert i.filename not in entries
                  with archive.open(i) as stream: entries[i.filename]=dict(bytes=i.file_size,sha256=identity(stream))
              return entries
          root=Path(os.environ['GITHUB_WORKSPACE'])
          baseline='c0d251847496c64170bb31d534a925afd1d8e7f92c21687e0e1cbf82c056e6fa'
          assert json.loads((root/'app/stock-signing.lock.json').read_bytes())['lastPublished']==dict(versionCode=19,apkSha256=baseline)
          helpers={'server_session.py':(33726,'a7ed8fb8122bd3021a805ce2718db2ea82e86f8a8770bd9dd70d200c745885ef'),
                   'server_session_process.py':(19208,'269f5b28914ff72288cc213346366808e151a66165d9cf791cf8304b3495fd84')}
          prefix='assets/server-session/'
          paths={prefix+n for n in (*helpers,'manifest.json')}
          with zipfile.ZipFile('v19.apk') as old,zipfile.ZipFile('v20.apk') as new:
              before,after=inventory(old),inventory(new)
              assert before.keys()==after.keys() and {n for n in before if before[n]!=after[n]}==paths
              desc=json.loads(old.read(prefix+'manifest.json'))
              for n,(size,sha) in helpers.items():
                  source=(root/'runtime'/n).read_bytes()
                  assert source==new.read(prefix+n) and hashlib.sha256(source).hexdigest()==sha and len(source)==size
                  assert desc['files'][n]==before[prefix+n]
                  desc['files'][n]=after[prefix+n]
              manifest=new.read(prefix+'manifest.json')
              assert manifest==(json.dumps(desc,separators=(',',':'))+'\n').encode()
              assert hashlib.sha256(manifest).hexdigest()=='c5c53a87ecfdd9ddb3dba11c57eef030e1f671b4375b47b4e1cf11deb7eb141e'
              assert len(desc['files'])==26 and sum(v['bytes'] for v in desc['files'].values())==479100
          archives={n:v for n,v in after.items() if n.endswith('.archive')}
          assert len(archives)==8 and len(after)==127 and sum(n.startswith('lib/') for n in after)==4
          with open('v20.apk','rb') as stream: unsigned=identity(stream)
          proof=dict(producer='869d5de3c20596b314536bdb3fb3bf07176920b1',packageArtifact=13613428032,
              originalUnsignedApk=dict(bytes=os.stat('v20.apk').st_size,sha256=unsigned),previousPublishedApkSha256=baseline,
              changed={p:dict(previous=before[p],current=after[p]) for p in sorted(paths)},added=[],removed=[],
              unchangedProviderArchives=archives,unchangedAssets=120,unchangedNativeLibraries=4,packageId='io.github.russianranger.esteria.stock',
              androidSdkManifestChecked=True,priorSignerAndV2V3Checked=True,candidateUnsigned=True,thorQualified=False,gameplayQualified=False)
          Path('original-apk-delta.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          print('Verified original unsigned APK:',proof['originalUnsignedApk'],'changed files:',len(paths),'unchanged provider archives:',len(archives))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-v20-apk-delta-869d5de
          path: ${{ runner.temp }}/original-apk-delta.json
          if-no-files-found: error
          retention-days: 30
