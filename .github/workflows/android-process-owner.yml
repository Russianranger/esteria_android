name: Android 13 native process owner
on:
  push:
    branches: [android/client-server]
    paths:
      - native/process-owner/**
      - native/CMakeLists.txt
      - core/src/main/java/**/runtime/process/**
      - app/src/main/java/**/runtime/NativeProcessBridge.java
      - app/src/androidTest/**/NativeProcessOwnershipTest.java
      - app/build.gradle
      - tools/qualify_android_owner.py
      - tests/test_android_owner_qualification.py
      - .github/workflows/android-process-owner.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-process-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Enable runner KVM for the disposable emulator
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned Android command-line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Install pinned SDK and source-build tools
        run: |
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build x86_64 native owner and mandatory instrumentation
        run: |
          mkdir -p out/android-owner
          sha256sum --check gradle/wrapper/SHA256SUMS
          python3 -m unittest tests.test_android_owner_qualification tests.test_android_installer_qualification -v
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativeRuntimeBridge=true -PnativeBridgeAbi=x86_64 -PsourceRevision="$GITHUB_SHA"
          cp app/build/outputs/apk/debug/app-debug.apk out/android-owner/owner.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/android-owner/tests.apk
      - name: Execute installed JNI ownership with actual Android system processes
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/qualify_android_owner.py --apk out/android-owner/owner.apk --test-apk out/android-owner/tests.apk --source-revision "$GITHUB_SHA" --output out/android-owner/evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-13-native-owner-evidence-${{ github.sha }}
          path: out/android-owner/evidence
          if-no-files-found: warn
          retention-days: 14
