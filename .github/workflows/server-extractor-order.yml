name: Separate ordered extractor targets and synthetic provider gates
on:
  workflow_dispatch:
  push:
    branches: [android/client-server]
    paths:
      - .github/workflows/server-extractor-order.yml
      - runtime/extractor_order.py
      - runtime/server/extractor-order.lock.json
      - runtime/server/extractor-order/**
      - runtime/server/EXTRACTOR-ORDER.md
      - tools/prepare_ordered_extractors.py
      - tools/build_ordered_extractors.py
      - tools/capture_ordered_extractor_dependencies.py
      - tests/test_extractor_order.py
      - tests/test_ordered_extractor_build.py
      - tests/test_ordered_extractor_dependencies.py
      - tests/extractor_order_reference.cpp
      - tests/extractor_mpqfile_reference.cpp
permissions:
  contents: read
  actions: read
concurrency:
  group: ordered-extractor-targets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ordered-targets:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check manifest and separate build guards before acquiring source
        run: |
          test "$(uname -m)" = aarch64
          python3 -m unittest tests.test_extractor_order tests.test_ordered_extractor_build \
            tests.test_ordered_extractor_dependencies -v
          mkdir -p out/ordered-evidence
          # Reproduce the upload traversal failure using the real runner uid.
          fixture=$(mktemp -d out/publication-owner.XXXXXX)
          sudo chown root:root "$fixture"
          sudo mkdir "$fixture/payload"
          sudo mkdir -m 700 "$fixture/private"
          sudo chown "$(id -u):$(id -g)" "$fixture/payload"
          if test -d "$fixture/payload"; then exit 1; fi
          sudo chown "$(id -u):$(id -g)" "$fixture"
          test -d "$fixture/payload"
          test "$(stat -c %a "$fixture")" = 700
          if test -r "$fixture/private"; then exit 1; fi
          sudo rm -rf -- "$fixture"
      - name: Select unchanged archived server lock and exact client ordering sources
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools import server_provider_sources as sources
          from tools import prepare_server_isolated_build as build
          pin=json.loads(Path('runtime/server/programs-provider.lock.json').read_text())
          sources.validate_current(pin,Path('sources.lock.json'))
          path=Path('out/ordered-original-sources.lock.json')
          with path.open('xb') as output:output.write(pin['serverBuildSourceLockText'].encode('utf-8'))
          path.chmod(0o444);build.load_pin(path)
          PY
          python3 tools/build_ordered_extractors.py client-policy --output out/ordered-client-policy \
            > out/ordered-evidence/client-policy.json
      - name: Acquire exact original source export, header and compiler environment metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/prepare_server_isolated_build.py acquire --output out/ordered-inputs \
            --original-lock out/ordered-original-sources.lock.json > out/ordered-evidence/acquisition.log 2>&1
          cp out/ordered-inputs/acquisition.json out/ordered-evidence/
      - name: Install and verify relevant pinned native build dependencies
        run: |
          mapfile -t packages < <(python3 tools/prepare_server_isolated_build.py packages \
            --original-lock out/ordered-original-sources.lock.json)
          test "${#packages[@]}" = 10
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y "${packages[@]}"
          python3 tools/prepare_server_isolated_build.py environment --inputs out/ordered-inputs \
            --original-lock out/ordered-original-sources.lock.json --output out/ordered-evidence/environment.json
      - name: Replay the unchanged seven-patch asset-free source export
        run: |
          python3 tools/prepare_server_isolated_sources.py --source-inputs out/ordered-inputs/source-inputs \
            --supplements out/ordered-inputs/supplements --original-lock out/ordered-original-sources.lock.json \
            --output out/ordered-base > out/ordered-evidence/base-preparation.json
          test ! -e out/ordered-base/source/.git
          test ! -e out/ordered-base/source/Harvested
          test ! -e out/ordered-base/source/Data
      - name: Build only adapted map and vmap readers offline and test actual constructors
        id: component
        run: |
          sudo env PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 CCACHE_DISABLE=1 \
            unshare --net -- sh -c 'ip link set lo up; exec "$@"' sh \
            python3 tools/build_ordered_extractors.py build \
            --prepared "$GITHUB_WORKSPACE/out/ordered-base" --inputs "$GITHUB_WORKSPACE/out/ordered-inputs" \
            --original-lock "$GITHUB_WORKSPACE/out/ordered-original-sources.lock.json" \
            --environment "$GITHUB_WORKSPACE/out/ordered-evidence/environment.json" \
            --client-policy "$GITHUB_WORKSPACE/out/ordered-client-policy" \
            --integration-revision "$GITHUB_SHA" --output "$GITHUB_WORKSPACE/out/ordered-build" \
            > out/ordered-evidence/build.log 2>&1
      - name: Collect bounded public build and synthetic lookup receipts
        if: always()
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import shutil
          source=Path('out/ordered-build');target=Path('out/ordered-evidence')
          target.mkdir(parents=True,exist_ok=True)
          if (source/'qualification.json').is_file():shutil.copyfile(source/'qualification.json',target/'ordered-build.json')
          logs=source/'diagnostics'
          if logs.is_dir():
              for path in logs.iterdir():
                  if not path.is_file():continue
                  if path.suffix=='.json' and path.stat().st_size<=16*1024**2:shutil.copyfile(path,target/path.name)
                  elif path.suffix=='.log':
                      with path.open('rb') as stream:
                          stream.seek(max(0,path.stat().st_size-256*1024))
                          (target/(path.stem+'-tail.log')).write_bytes(stream.read(256*1024))
          PY
          sudo chown -R "$(id -u):$(id -g)" out/ordered-evidence
          # The native builder creates this owned parent root:root 0700.
          if sudo test -d out/ordered-build; then
            sudo chown "$(id -u):$(id -g)" out/ordered-build
          fi
          if test -d out/ordered-build/payload; then sudo chown -R "$(id -u):$(id -g)" out/ordered-build/payload; fi
      - name: Retain new unsealed extractor binaries and selected replay inputs separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.component.outcome == 'success'
        with:
          name: separate-ordered-extractors-${{ github.sha }}
          compression-level: 0
          path: out/ordered-build/payload/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ordered-extractor-build-evidence-${{ github.sha }}
          path: out/ordered-evidence/
          retention-days: 30
          if-no-files-found: error
