name: Preserve measured selected471 source-owned Wine provider cohort
on:
  workflow_dispatch:
  push:
    branches: [android/client-server]
    paths:
      - runtime/wine-cohort-publication/dependency-release.lock.json
permissions:
  contents: read
concurrency:
  group: preserve-selected471-source-owned-wine-cohort
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      recipe_revision: ${{ steps.selection.outputs.recipe_revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select the exact separately published packaging recipe
        id: selection
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          lock=json.load(open('runtime/wine-cohort-publication/dependency-release.lock.json'))
          revision=lock['targetCommit'];assert re.fullmatch('[0-9a-f]{40}',revision)
          print('recipe_revision='+revision)
          PY
          cp runtime/wine-cohort-publication/dependency-release.lock.json "$RUNNER_TEMP/wine-cohort-release.lock.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.selection.outputs.recipe_revision }}
          path: source-packaging
          persist-credentials: false
      - name: Test exact original-source and upload-only rejection boundaries
        working-directory: source-packaging
        run: python3 -m unittest tests.test_wine_cohort_release -v
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Russianranger/wowdecomp_esteria
          ref: 471ee42faadf4a97a1d0a86989cf1452621f2dc5
          path: client-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 75f50445112818c97f8d8e575d2b1c21e59af6e5
          path: producer-source
          persist-credentials: false
      - name: Reproduce retained provider and complete source packages without compiling a binary
        working-directory: source-packaging
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth 1 origin 75f50445112818c97f8d8e575d2b1c21e59af6e5
          git fetch --no-tags --depth 1 origin 33cf433a907a9181d27a6962b1f07516afc0773d
          python3 tools/release_wine_cohort.py prepare --client-source "$GITHUB_WORKSPACE/client-source" \
            --producer-source "$GITHUB_WORKSPACE/producer-source" --output "$RUNNER_TEMP/wine-cohort-inputs"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools import release_wine_cohort as release
          lock=release.load_lock(Path(os.environ['RUNNER_TEMP'])/'wine-cohort-release.lock.json')
          release.stage(Path(os.environ['RUNNER_TEMP'])/'wine-cohort-inputs',
            Path(os.environ['RUNNER_TEMP'])/'wine-cohort-inputs/client-original-inputs/reconstructed-client-arm64-original.zip',
            lock['targetCommit'],Path('out/release-candidate'),existing_lock=lock)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-selected471-source-owned-wine-cohort
          path: source-packaging/out/release-candidate
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  upload-draft:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve explicit release selection before checking out its exact recipe
        run: cp runtime/wine-cohort-publication/dependency-release.lock.json "$RUNNER_TEMP/wine-cohort-release.lock.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.recipe_revision }}
          path: source-packaging
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-selected471-source-owned-wine-cohort
          path: source-packaging/out/release-candidate
      - name: Read back all provider and source bytes and add only missing exact owned-draft assets
        working-directory: source-packaging
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth 1 origin 75f50445112818c97f8d8e575d2b1c21e59af6e5
          python3 tools/release_wine_cohort.py upload-draft --release-lock "$RUNNER_TEMP/wine-cohort-release.lock.json" \
            --inputs out/release-candidate --output out/draft-assets-verified.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected471-source-owned-wine-cohort-draft-readiness
          path: source-packaging/out/draft-assets-verified.json
          retention-days: 14
          if-no-files-found: error
  verify-publication:
    needs: [validate, upload-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve explicit release selection before checking out its exact recipe
        run: cp runtime/wine-cohort-publication/dependency-release.lock.json "$RUNNER_TEMP/wine-cohort-release.lock.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.recipe_revision }}
          path: source-packaging
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-selected471-source-owned-wine-cohort
          path: source-packaging/out/release-candidate
      - name: Verify actual UI publication tag and every stored byte without mutation
        working-directory: source-packaging
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth 1 origin 75f50445112818c97f8d8e575d2b1c21e59af6e5
          python3 tools/release_wine_cohort.py verify-published --release-lock "$RUNNER_TEMP/wine-cohort-release.lock.json" \
            --inputs out/release-candidate --output out/published-release.json --wait-seconds 1200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected471-source-owned-wine-cohort-publication-receipt
          path: source-packaging/out/published-release.json
          retention-days: 14
          if-no-files-found: error
