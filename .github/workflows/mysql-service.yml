name: Pinned persistent MySQL service qualification
on:
  push:
    branches: [android/client-server]
    paths:
      - runtime/mysql_service.py
      - runtime/mysql_bootstrap.py
      - runtime/server/**
      - tests/test_server_dependency_image.py
      - tools/verify_server_dependency_image.py
      - tools/prepare_server_dependency_image.py
      - tools/release_server_dependencies.py
      - tools/owned_process_group.py
      - tests/test_mysql_service.py
      - .github/workflows/mysql-service.yml
  pull_request:
    paths:
      - runtime/mysql_service.py
      - runtime/mysql_bootstrap.py
      - runtime/server/**
      - tests/test_server_dependency_image.py
      - tools/verify_server_dependency_image.py
      - tools/prepare_server_dependency_image.py
      - tools/release_server_dependencies.py
      - tools/owned_process_group.py
      - tests/test_mysql_service.py
      - .github/workflows/mysql-service.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mysql-service-${{ github.ref }}
  cancel-in-progress: false
jobs:
  persistent-service:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check service ownership and startup guards
        run: |
          test "$(uname -m)" = aarch64
          python3 -m unittest tests.test_mysql_service.ServiceGuards tests.test_owned_process_group tests.test_server_dependency_image -v
          mkdir -p out/mysql-service-evidence out/mysql-service-private
      - name: Prepare and read back the exact published dependency image without APT
        run: |
          env -u GITHUB_TOKEN python3 tools/release_server_dependencies.py prepare --output out/mysql-service-dependency-release \
            > out/mysql-service-evidence/dependency-download.log 2>&1
          python3 tools/prepare_server_dependency_image.py --inputs out/mysql-service-dependency-release \
            --output out/mysql-service-dependency-image > out/mysql-service-evidence/dependency-context.log 2>&1
          cp out/mysql-service-dependency-image/context-receipt.json out/mysql-service-evidence/dependency-context.json
          cp out/mysql-service-dependency-release/server-runtime.json out/mysql-service-evidence/server-runtime.json
          rm -rf out/mysql-service-dependency-release
          docker build --network none --platform linux/arm64 -t esteria-mysql-service:qualification \
            out/mysql-service-dependency-image/context > out/mysql-service-evidence/image-build.log 2>&1
          docker image inspect esteria-mysql-service:qualification --format '{{.Id}}' > out/mysql-service-evidence/image-id.txt
          docker run --rm --network none --read-only \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tools/verify_server_dependency_image.py,dst=/verify-image.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/mysql-service-dependency-image/context-receipt.json,dst=/context-receipt.json,readonly" \
            esteria-mysql-service:qualification /usr/bin/python3 /verify-image.py --context-receipt /context-receipt.json \
            > out/mysql-service-evidence/dependency-image-check.json
          python3 - <<'PY'
          import json, os, pathlib
          check = json.loads(pathlib.Path('out/mysql-service-evidence/dependency-image-check.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ESTERIA_MYSQL_SERVICE_VERSION=' + check['expectedMysqlSqlVersion'] + '\n')
          PY
      - name: Exercise exact service CLI and restart persistence without external network
        run: |
          docker run --rm --init --network none \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env ESTERIA_MYSQL_SERVICE_INTEGRATION=1 \
            --env "ESTERIA_MYSQL_SERVICE_VERSION=$ESTERIA_MYSQL_SERVICE_VERSION" \
            --env ESTERIA_MYSQL_SERVICE_EVIDENCE=/evidence \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/qualification,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/mysql-service-private,dst=/work" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/out/mysql-service-evidence,dst=/evidence" \
            --workdir /qualification esteria-mysql-service:qualification \
            python3 -m unittest tests.test_mysql_service.RealMysqlService -v \
            > out/mysql-service-evidence/qualification.log 2>&1
      - name: Bind successful fixture evidence to exact source and runtime
        if: always()
        run: |
          mkdir -p out/mysql-service-evidence
          sudo chown -R "$(id -u):$(id -g)" out/mysql-service-evidence
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('out/mysql-service-evidence')
          root.mkdir(parents=True, exist_ok=True)
          evidence = root / 'qualification.json'
          runtime = root / 'server-runtime.json'
          if evidence.is_file() and runtime.is_file():
              report = dict(formatVersion=1, scope='native-arm64-persistent-mysql-service-environment',
                  integrationRevision=os.environ['GITHUB_SHA'],
                  qualificationSha256=hashlib.sha256(evidence.read_bytes()).hexdigest(),
                  runtimeManifestSha256=hashlib.sha256(runtime.read_bytes()).hexdigest(),
                  externalNetworkDisabled=True, freshDisposableStateOnly=True,
                  applicationSchemaUpdatesQualified=False, characterPersistenceQualified=False,
                  androidQualified=False, gameplayQualified=False)
              (root / 'environment-receipt.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mysql-service-qualification-${{ github.sha }}
          path: out/mysql-service-evidence
          retention-days: 14
          if-no-files-found: error
