name: Android 13 x64 guest stat alias and mutation qualification
on:
  workflow_dispatch:
  push:
    branches: [android/client-server]
    paths:
      - native/proot-stat-probe/**
      - native/proot-probe/**
      - native/process-owner/**
      - runtime/proot/**
      - app/src/androidTest/**/ProotStatMetadataTest.java
      - app/src/androidTest/assets/proot-stat-probe/.gitignore
      - tools/build_android_proot_stat_probe.py
      - tools/qualify_android_proot_stat.py
      - tools/build_android_proot_probe.py
      - tools/verify_android_proot_probe.py
      - tests/test_android_proot_stat.py
      - .github/workflows/android-proot-stat.yml
permissions:
  contents: read
concurrency:
  group: android-proot-stat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stat:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Exercise actual host mutations and strict Android admission guards
        run: |
          python3 -m unittest tests.test_android_proot_stat -v
          mkdir -p out/android-proot-stat
      - name: Enable KVM for the disposable emulator
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exact Android tools and the pinned NDK
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-stat-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          export PATH="$ANDROID_HOME/cmdline-tools/12.0/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Build the unchanged exact PRoot probe and separate stat fixture
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from tools.prepare_runtime import fetch
          lock=json.loads(Path('runtime/proot/sources.lock.json').read_bytes())
          fetch(lock['source'],Path(os.environ['RUNNER_TEMP'])/'probe-cache')
          PY
          python3 tools/build_android_proot_probe.py --sources "$RUNNER_TEMP/probe-cache/runtime-corresponding-sources.tar.gz" \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" --cache "$RUNNER_TEMP/probe-cache" --download --work "$RUNNER_TEMP/proot-probe"
          python3 tools/build_android_proot_stat_probe.py build --proot-work "$RUNNER_TEMP/proot-probe" \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" --work "$RUNNER_TEMP/stat-probe" --source-revision "$GITHUB_SHA" \
            --test-assets "$GITHUB_WORKSPACE/app/src/androidTest/assets/proot-stat-probe"
      - name: Compile and verify the source-bound instrumentation fixture
        run: |
          sha256sum --check gradle/wrapper/SHA256SUMS
          ./gradlew --no-daemon :app:clean :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug \
            -PnativeRuntimeBridge=true -PnativeBridgeAbi=x86_64 -PprootProbeProviderDir="$RUNNER_TEMP/proot-probe/provider" \
            -PsourceRevision="$GITHUB_SHA" > out/android-proot-stat/gradle.log 2>&1
          python3 tools/verify_android_proot_probe.py --provider "$RUNNER_TEMP/proot-probe/provider" --apk app/build/outputs/apk/debug/app-debug.apk
          python3 tools/build_android_proot_stat_probe.py verify --provider "$RUNNER_TEMP/stat-probe/provider" \
            --test-apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Release only this job's completed build inputs before emulator provisioning
        run: |
          python3 - <<'PY'
          # BEGIN GUARDED STAT BUILD INPUT CLEANUP
          import hashlib,json,os,shutil
          from pathlib import Path
          def cleanup_stat_build_inputs(root_value,sdk_value):
              def need(ok,reason):
                  if not ok:raise ValueError(reason)
              root=Path(root_value)
              need(root.is_absolute() and root.is_dir() and root.resolve(strict=True)==root,'canonical runner temporary directory required')
              sdk=root/'esteria-stat-sdk'
              need(sdk_value==str(sdk) and sdk.is_dir() and sdk.resolve(strict=True)==sdk,'only the exact job-owned stat SDK may be cleaned')
              def plain(path,maximum):
                  need(path.is_file() and not path.is_symlink() and path.resolve(strict=True)==path,'retained build input must be a canonical regular file')
                  need(0<path.stat().st_size<=maximum,'retained build input exceeds bound')
                  return path
              def identity(path,maximum):
                  plain(path,maximum);digest=hashlib.sha256();count=0
                  with path.open('rb') as incoming:
                      for block in iter(lambda:incoming.read(131072),b''):
                          count+=len(block);need(count<=maximum,'retained build input grew');digest.update(block)
                  need(count==path.stat().st_size,'retained build input changed size')
                  return dict(bytes=count,sha256=digest.hexdigest())
              retained=root/'stat-probe'
              receipt=plain(retained/'provider/assets/proot-stat-probe/build-evidence.json',128<<10)
              proof=json.loads(receipt.read_bytes())
              need(proof.get('scope')=='android-x86_64-glibc-stat-fixture-build-only' and proof.get('sourceSnapshotExact') is True,'exact committed fixture receipt required before cleanup')
              need(identity(receipt,128<<10)==identity(retained/'build-evidence.json',128<<10),'retained fixture receipts differ')
              need(identity(retained/'corresponding-source.tar.gz',128<<20)==proof.get('sourceCompanion'),'complete corresponding source must remain retained')
              need(identity(root/'proot-probe/provider/assets/proot-probe/build-evidence.json',128<<10)==proof.get('prootBuildEvidence'),'original PRoot provider receipt must remain retained')
              ndk=sdk/'ndk/28.2.13676358';download=root/'android-commandline.zip'
              need(ndk.is_dir() and not ndk.is_symlink() and ndk.resolve(strict=True)==ndk,'exact plain job-owned NDK directory required')
              plain(download,256<<20)
              # All retention/path checks precede either deletion. The finished
              # APKs and qualifier need SDK platform-tools/emulator, not the NDK.
              shutil.rmtree(ndk);download.unlink()
              return dict(removed=['esteria-stat-sdk/ndk/28.2.13676358','android-commandline.zip'],
                  providerReceiptsRetained=True,completeSourceCompanionRetained=True)
          if __name__=='__main__':print(json.dumps(cleanup_stat_build_inputs(os.environ['RUNNER_TEMP'],os.environ['ANDROID_HOME']),sort_keys=True))
          # END GUARDED STAT BUILD INPUT CLEANUP
          PY
      - name: Observe actual Android guest tuples through both bound aliases
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/qualify_android_proot_stat.py --apk app/build/outputs/apk/debug/app-debug.apk --test-apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --proot-provider "$RUNNER_TEMP/proot-probe/provider" --stat-provider "$RUNNER_TEMP/stat-probe/provider" --source-revision "$GITHUB_SHA" --output out/android-proot-stat/evidence
      - name: Retain exact probe APKs separately from any device candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unqualified-android-x64-stat-probe-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 30
      - name: Bound retained Gradle diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('out/android-proot-stat/gradle.log')
          if path.is_file():
              with path.open('rb') as incoming:
                  incoming.seek(max(0,path.stat().st_size-256*1024))
                  path.with_name('gradle-tail.log').write_bytes(incoming.read(256*1024))
          PY
      - name: Retain complete fixture and original probe corresponding sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-x64-stat-probe-sources-${{ github.sha }}
          path: ${{ runner.temp }}/stat-probe/corresponding-source.tar.gz
          if-no-files-found: warn
          retention-days: 30
      - name: Retain bounded actual observations and build receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-x64-stat-probe-evidence-${{ github.sha }}
          path: |
            out/android-proot-stat/evidence/
            out/android-proot-stat/gradle-tail.log
            ${{ runner.temp }}/stat-probe/build-evidence.json
            ${{ runner.temp }}/stat-probe/build.log
            ${{ runner.temp }}/proot-probe/build-evidence.json
          if-no-files-found: warn
          retention-days: 30
