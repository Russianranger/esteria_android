name: Android 13 x64 private handoff remote-process recovery
on:
  workflow_dispatch:
  push:
    branches: [android/client-server]
    paths:
      - app/build.gradle
      - app/handoff-probe.gradle
      - app/src/handoffProbe/**
      - app/src/androidTest/**/LocalHandoffRecoveryInstrumentedTest.java
      - core/src/main/java/**/LocalAccountHandoff.java
      - core/src/main/java/**/LocalHandoffRecovery.java
      - core/src/main/java/**/ClientLaunchView.java
      - core/src/main/java/**/RuntimeFiles.java
      - core/src/main/java/**/RuntimeWork.java
      - tools/qualify_android_handoff.py
      - tests/test_android_handoff.py
      - .github/workflows/android-handoff-recovery.yml
permissions:
  contents: read
concurrency:
  group: android-handoff-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  handoff:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Check bounded APK manifest source receipt and fresh-emulator admission
        run: |
          python3 -m unittest tests.test_android_handoff -v
          mkdir -p out/android-handoff
      - name: Enable KVM for the disposable x64 emulator
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned Android SDK platform and build tools without an NDK
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-handoff-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          export PATH="$ANDROID_HOME/cmdline-tools/12.0/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Build ordinary APK and prove all remote-death fixture surfaces are absent
        run: |
          sha256sum --check gradle/wrapper/SHA256SUMS
          ./gradlew --no-daemon :app:clean :app:assembleDebug -PsourceRevision="$GITHUB_SHA" > out/android-handoff/ordinary-gradle-private.log 2>&1
          cp app/build/outputs/apk/debug/app-debug.apk out/android-handoff/ordinary.apk
          python3 - <<'PY'
          from pathlib import Path
          import json
          from tools.qualify_android_handoff import verify_apk
          proof=verify_apk(Path('out/android-handoff/ordinary.apk'),enabled=False)
          Path('out/android-handoff/ordinary-exclusion.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          PY
      - name: Build only the explicit debug remote-process fixture and Android tests
        run: |
          ./gradlew --no-daemon :app:clean :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug \
            -PhandoffEmulatorTest=true -PnativeRuntimeBridge=false -PnativeBridgeAbi=x86_64 \
            -PsourceRevision="$GITHUB_SHA" > out/android-handoff/fixture-gradle-private.log 2>&1
          cp app/build/outputs/apk/debug/app-debug.apk out/android-handoff/probe.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/android-handoff/tests.apk
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          from tools.qualify_android_handoff import verify_apk
          proof=verify_apk(Path('out/android-handoff/probe.apk'),enabled=True,revision=os.environ['GITHUB_SHA'])
          Path('out/android-handoff/fixture-apk-verification.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve the exact complete source snapshot and fixture selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          from tools.qualify_android_handoff import identity,verify_apk
          root=Path('out/android-handoff');archive=root/'handoff-source.tar.gz'
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(archive),os.environ['GITHUB_SHA']],check=True)
          proof=verify_apk(root/'probe.apk',enabled=True,revision=os.environ['GITHUB_SHA'])
          receipt=dict(formatVersion=1,scope='android-handoff-fixture-complete-source-companion-only',
              sourceRevision=os.environ['GITHUB_SHA'],sourceArchive=identity(archive),buildEvidence=proof['buildEvidence'],
              fixtureApk=identity(root/'probe.apk'),testApk=identity(root/'tests.apk'),
              importedGameData=False,credentialsOrHandoffRecordsExported=False,
              androidExecutionQualified=False,arm64Qualified=False,gameplayQualified=False)
          (root/'source-companion.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Execute five real Binder-death recovery phases and active-owner exclusion
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/qualify_android_handoff.py --apk out/android-handoff/probe.apk --test-apk out/android-handoff/tests.apk --source-revision "$GITHUB_SHA" --output out/android-handoff/evidence
      - name: Retain bounded build diagnostics without private app state
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('out/android-handoff')
          for name in ('ordinary','fixture'):
              source=root/(name+'-gradle-private.log')
              if source.is_file():
                  with source.open('rb') as incoming:
                      incoming.seek(max(0,source.stat().st_size-(128<<10)))
                      (root/(name+'-gradle-tail.log')).write_bytes(incoming.read(128<<10))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-x64-handoff-recovery-evidence-${{ github.sha }}
          path: |
            out/android-handoff/evidence/*.json
            out/android-handoff/evidence/*.log
            out/android-handoff/ordinary-exclusion.json
            out/android-handoff/fixture-apk-verification.json
            out/android-handoff/source-companion.json
            out/android-handoff/*-gradle-tail.log
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unqualified-android-x64-handoff-apks-and-source-${{ github.sha }}
          path: |
            out/android-handoff/ordinary.apk
            out/android-handoff/probe.apk
            out/android-handoff/tests.apk
            out/android-handoff/handoff-source.tar.gz
            out/android-handoff/source-companion.json
          retention-days: 30
          if-no-files-found: warn
