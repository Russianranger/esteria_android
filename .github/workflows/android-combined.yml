name: Source-verified combined ARM64 package
on:
  workflow_dispatch:
  push:
    branches: [android/client-server]
    paths:
      - 'app/**'
      - 'core/**'
      - 'native/CMakeLists.txt'
      - 'native/process-owner/**'
      - 'native/presentation/**'
      - 'runtime/proot/**'
      - 'runtime/server/android-provider.lock.json'
      - 'runtime/server/dependency-release.lock.json'
      - 'runtime/bridges/android-provider.lock.json'
      - 'runtime/bridges/dependency-release.lock.json'
      - 'runtime/bridges/x11-runtime.lock.json'
      - 'runtime/client/android-provider.lock.json'
      - 'runtime/client/dependency-release.lock.json'
      - 'runtime/mysql_bootstrap.py'
      - 'runtime/mysql_service.py'
      - 'runtime/android_database_setup.py'
      - 'sources.lock.json'
      - 'tools/package_combined_android.py'
      - 'tools/build_android_proot.py'
      - 'tools/verify_android_proot.py'
      - 'tools/provider_*'
      - 'tools/release_*'
      - 'tools/dependency_publication.py'
      - 'tools/android*_elf.py'
      - 'tools/prepare_runtime.py'
      - 'tests/test_combined_android.py'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - '.github/workflows/android-combined.yml'
permissions:
  contents: read
concurrency:
  group: combined-arm64-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Validate packaging guards and acquire exact client Git tree
        run: |
          python3 -m unittest tests.test_combined_android tests.test_provider_publication tests.test_client_release -v
          python3 tools/fetch_sources.py client --output sources
      - name: Acquire durable provider inputs anonymously, including full sources
        run: |
          env -u GITHUB_TOKEN python3 tools/release_server_dependencies.py prepare --output "$RUNNER_TEMP/server-release"
          env -u GITHUB_TOKEN python3 tools/release_guest_bridges.py fetch --output "$RUNNER_TEMP/guest-release"
          env -u GITHUB_TOKEN python3 tools/release_client_inputs.py fetch --client-source sources/client --output "$RUNNER_TEMP/client-release"
      - name: Build providers from the exact durable inputs and current source lock
        run: |
          python3 tools/provider_server_runtime.py build --package "$RUNNER_TEMP/server-release" --output "$RUNNER_TEMP/server-provider"
          python3 tools/release_guest_bridges.py export-payload --inputs "$RUNNER_TEMP/guest-release" --output "$RUNNER_TEMP/guest-payload"
          python3 tools/provider_guest_bridges.py build --payload "$RUNNER_TEMP/guest-payload" --output "$RUNNER_TEMP/guest-provider"
          python3 tools/provider_client_runtime.py build --artifact "$RUNNER_TEMP/client-release/reconstructed-client-arm64-original.zip" --client-source sources/client --provider "$RUNNER_TEMP/client-provider" > "$RUNNER_TEMP/client-provider.json"
      - name: Build pinned Bionic ARM64 PRoot and matching complete source companion
        run: |
          curl --fail --location --retry 2 --max-time 600 https://github.com/Russianranger/uo-android-launcher/releases/download/v0.2.0/runtime-corresponding-sources.tar.gz -o "$RUNNER_TEMP/proot-original-sources.tar.gz"
          curl --fail --location --retry 2 --max-time 900 https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o "$RUNNER_TEMP/android-ndk-r28c-linux.zip"
          python3 tools/build_android_proot.py --sources "$RUNNER_TEMP/proot-original-sources.tar.gz" --ndk-zip "$RUNNER_TEMP/android-ndk-r28c-linux.zip" --work "$RUNNER_TEMP/proot-build"
          python3 tools/verify_android_proot.py --provider "$RUNNER_TEMP/proot-build/provider"
      - name: Install pinned Android command-line tools and complete the already verified NDK
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-combined-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/ndk"
          curl --fail --location --retry 3 --max-time 600 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          # The PRoot builder already verified the complete NDK ZIP hash. Fill
          # missing CMake/build files without overwriting its compiler/runtime.
          unzip -q -n "$RUNNER_TEMP/android-ndk-r28c-linux.zip" -d "$RUNNER_TEMP/proot-build/toolchain"
          ln -s "$RUNNER_TEMP/proot-build/toolchain/android-ndk-r28c" "$ANDROID_HOME/ndk/28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Install Android platform, build tools and CMake
        run: |
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1'
      - name: Clean profile, test core behavior, compile native ARM64 and lint combined app
        run: |
          sha256sum --check gradle/wrapper/SHA256SUMS
          ./gradlew --no-daemon :app:clean :core:check :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug \
            -PsourceRevision="${GITHUB_SHA}" -PnativeRuntimeBridge=true -PnativeBridgeAbi=arm64-v8a \
            -PprootProviderDir="$RUNNER_TEMP/proot-build/provider" \
            -PserverRuntimeProviderDir="$RUNNER_TEMP/server-provider" \
            -PguestBridgeProviderDir="$RUNNER_TEMP/guest-provider" \
            -PclientRuntimeProviderDir="$RUNNER_TEMP/client-provider" \
            -PclientRuntimeArtifact="$RUNNER_TEMP/client-release/reconstructed-client-arm64-original.zip" \
            -PclientRuntimeSource="$GITHUB_WORKSPACE/sources/client" 2>&1 | tee "$RUNNER_TEMP/combined-gradle.log"
      - name: Verify final bytes, source closure and seal paired internal artifacts
        run: |
          python3 tools/package_combined_android.py --revision "${GITHUB_SHA}" \
            --apk app/build/outputs/apk/debug/app-debug.apk --ndk-archive "$RUNNER_TEMP/android-ndk-r28c-linux.zip" \
            --proot-provider "$RUNNER_TEMP/proot-build/provider" --proot-sources "$RUNNER_TEMP/proot-build/proot-corresponding-source.tar.gz" \
            --server-provider "$RUNNER_TEMP/server-provider" --server-release "$RUNNER_TEMP/server-release" \
            --guest-provider "$RUNNER_TEMP/guest-provider" --guest-release "$RUNNER_TEMP/guest-release" \
            --client-provider "$RUNNER_TEMP/client-provider" --client-release "$RUNNER_TEMP/client-release" \
            --client-source sources/client --output "$RUNNER_TEMP/combined-package"
      - name: Retain verified internal APK and evidence, never a device-test candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unqualified-combined-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/combined-package/binary/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain every complete corresponding-source companion with the same build receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combined-arm64-corresponding-sources-${{ github.sha }}
          path: ${{ runner.temp }}/combined-package/sources/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded build diagnostics and lint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combined-arm64-build-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/combined-gradle.log
            ${{ runner.temp }}/proot-build/build.log
            ${{ runner.temp }}/proot-build/build-evidence.json
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
