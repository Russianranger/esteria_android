name: Preserve measured guest helpers
on:
  workflow_dispatch:
  push:
    branches: [android/client-server]
    paths:
      - runtime/bridges/dependency-release.lock.json
      - tools/release_guest_bridges.py
      - tools/dependency_publication.py
      - tests/test_provider_publication.py
      - .github/workflows/preserve-guest-bridges.yml
permissions:
  contents: read
concurrency:
  group: preserve-measured-guest-helpers
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test validation and write-once behavior
        run: python3 -m unittest tests.test_provider_publication tests.test_guest_bridge_provider -v
      - name: Recover exact originals and validate exact helper binaries/source/notices
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_guest_bridges.py prepare \
            --inputs out/original-guest-artifact.zip --output out/release-candidate
      - name: Transfer only validated helper release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-guest-helper-release
          path: out/release-candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
  upload-draft:
    needs: validate
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-guest-helper-release
          path: out/release-candidate
      - name: Upload only to the exact existing UI-created draft and verify stored bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_guest_bridges.py upload-draft \
            --inputs out/release-candidate --output out/draft-assets-verified.json
      - name: Retain draft asset readiness without claiming publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guest-helper-draft-upload-receipt
          path: out/draft-assets-verified.json
          if-no-files-found: error
          retention-days: 14
  verify-publication:
    needs: [validate, upload-draft]
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-guest-helper-release
          path: out/release-candidate
      - name: Wait for authorized UI publication, then verify actual tag and every asset read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_guest_bridges.py verify-published \
            --inputs out/release-candidate --output out/published-release.json --wait-seconds 1200
      - name: Retain actual durable URLs and GitHub-reported immutability
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guest-helper-publication-receipt
          path: out/published-release.json
          if-no-files-found: error
          retention-days: 14
