name: Qualify stock ChromieCraft shaders
on:
  workflow_dispatch:
  push:
    branches: [non-custom]
permissions:
  contents: read
concurrency:
  group: stock-shader-corpus
  cancel-in-progress: false
jobs:
  translate:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/non-custom' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qualify stock shaders]'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and compile the enUS stock shader selection
        run: |
          test "$(uname -m)" = aarch64
          python3 -m unittest -v tests.test_stock_shader_corpus
          # Hosted runner only. Reserve 17.1 GB for MPQs plus the shader outputs and isolated Wine client.
          if [ "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -lt 24000000000 ]; then
            sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m tools.qualify_stock_shader_corpus
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stock-shader-qualification
          path: stock-shader-qualification.json
          if-no-files-found: error
          retention-days: 7
