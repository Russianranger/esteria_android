name: Complete non-custom local-game ARM64 package
on:
  workflow_dispatch:
    inputs:
      build_version_code:
        description: Positive release versionCode, increased before a signed update
        required: false
        default: '4'
        type: string
      publish_non_custom:
        description: Sign and publish an additive non-custom prerelease using the configured persistent key
        required: false
        default: false
        type: boolean
  push:
    branches: [non-custom]
    paths:
      - 'STATUS.md'
      - 'HANDOFF.md'
      - 'NON-CUSTOM-TESTING.md'
      - 'app/**'
      - 'core/**'
      - 'native/**'
      - 'runtime/runtime-sources.lock.json'
      - 'runtime/bridges/android-provider.lock.json'
      - 'runtime/bridges/sources.lock.json'
      - 'runtime/bridges/x11-runtime.lock.json'
      - 'runtime/turnip/android-provider.lock.json'
      - 'runtime/turnip/sources.lock.json'
      - 'runtime/shaders/android-provider.lock.json'
      - 'runtime/wine-cohort-publication/published-release.json'
      - 'tools/verify_wine_cohort_apk.py'
      - 'tools/sign_android_apk.py'
      - 'tools/sign_non_custom_ci.py'
      - 'tools/prepare_non_custom_release.py'
      - 'tests/test_non_custom_release.py'
      - 'tools/plan_wine_cohort_adoption.py'
      - 'tests/test_wine_cohort_apk.py'
      - 'runtime/server/programs-playerbots-provider.lock.json'
      - 'runtime/server/playerbots-helper-source-qualified.lock.json'
      - 'runtime/server/data-tools-provider.lock.json'
      - 'runtime/server/data-tools-qualified-artifacts.lock.json'
      - 'tools/provider_playerbots_programs.py'
      - 'tools/qualify_playerbots_programs.py'
      - 'tools/measure_playerbots_programs.py'
      - 'tools/provider_server_data_tools.py'
      - 'tools/prepare_data_tools_provider.py'
      - 'tools/measure_server_data_tools.py'
      - 'runtime/server-components-publication/dependency-release.lock.json'
      - 'runtime/server-components-publication/published-release.json'
      - 'runtime/server-components-publication/public-source-readback.json'
      - 'tools/fetch_local_server_profile.py'
      - 'tests/test_public_local_server_profile.py'
      - '.github/workflows/android-local-game-profile.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: coherent-local-game-provider-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selection:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[publish detached non-custom]')
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.profile.outputs.selected }}
      recipe: ${{ steps.profile.outputs.recipe }}
      server_source: ${{ steps.profile.outputs.server_source }}
      server_recipe: ${{ steps.profile.outputs.server_recipe }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: profile
        name: Require adopted Wine and exact qualified helper/data-tool provider inputs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          from pathlib import Path
          wine=json.loads(Path('runtime/runtime-sources.lock.json').read_bytes())['packages']['wine-arm64']
          environment=wine.get('wineEnvironment',{})
          assert type(environment) is dict and environment in ({},{'WINE_ANDROID_PRIVATE_PE_COPY':'1'})
          from tools.fetch_local_server_profile import selection
          server=selection()
          print('server_source='+server['source'])
          print('server_recipe='+(server['recipeRevision'] or ''))
          selected=bool(environment)
          print('selected='+str(selected).lower())
          if selected:
            from tools.plan_wine_cohort_adoption import plan
            from tools.release_wine_cohort import ROOT,identity
            value=plan()
            assert all(row['identity']==identity(ROOT/name) for name,row in value['files'].items())
            lock=json.loads(Path('runtime/wine-cohort-publication/dependency-release.lock.json').read_bytes())
            proof=json.loads(Path('runtime/wine-cohort-publication/public-source-readback.json').read_bytes())
            assert proof['actualPublicCohortAndEntireWineSourcesReadBack'] is True
            assert proof['releaseSelection']==identity(Path('runtime/wine-cohort-publication/dependency-release.lock.json'))
            assert re.fullmatch('[0-9a-f]{40}',lock['targetCommit'])
            from tools import provider_playerbots_programs as programs, provider_server_data_tools as data
            from tools import prepare_data_tools_provider as data_inputs
            programs.load_pin()
            data.load_pin(sealed=True)
            data_inputs.load_pin()
            print('recipe='+lock['targetCommit'])
          PY
  package:
    needs: selection
    if: needs.selection.outputs.selected == 'true' && github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/non-custom' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[publish detached non-custom]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION_CODE: ${{ inputs.build_version_code || '4' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.selection.outputs.recipe }}
          path: source-packaging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.selection.outputs.server_source == 'public-release'
        with:
          ref: ${{ needs.selection.outputs.server_recipe }}
          path: server-source-packaging
          persist-credentials: false
      - name: Recover original producer source history in the separate frozen recipe checkout
        working-directory: source-packaging
        run: git fetch --no-tags --depth 1 origin 75f50445112818c97f8d8e575d2b1c21e59af6e5
      - name: Validate strict cohort and both explicit server provider profiles
        run: |
          mkdir -p out/coherent-evidence out/coherent-logs
          python3 -m unittest tests.test_wine_cohort_apk tests.test_public_wine_cohort \
            tests.test_server_provider_qualification tests.test_combined_android \
            tests.test_playerbots_programs_provider tests.test_playerbots_programs_qualification \
            tests.test_server_data_tools_provider tests.test_qualified_data_tools_inputs \
            tests.test_public_local_server_profile tests.test_android_signing \
            tests.test_non_custom_release -v
          python3 tools/fetch_sources.py client --output sources
          git fetch --no-tags --depth 1 origin 75f50445112818c97f8d8e575d2b1c21e59af6e5
          git fetch --no-tags --depth 1 origin 681b2e9f30b19e94bf8e8de44f67fedba5033c8a
      - name: Exercise both public import routes through actual pinned-reader stock preparation
        run: |
          ESTERIA_CLIENT_SOURCE="$PWD/sources/client" \
          ESTERIA_STOCK_PIPELINE_EVIDENCE="$PWD/out/coherent-evidence/stock-import-preparation.json" \
            python3 -m unittest tests.test_stock_content_inspection -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('out/coherent-evidence/stock-import-preparation.json').read_bytes())
          assert len(proof['routes'])==6 and proof['unknownOverlayRoutesRejected']==2
          assert {row['route'] for row in proof['routes']}=={'folder','zip'}
          assert all(row['clientDbcs']==238 and row['providers']==11 and row['exclusions']==3 for row in proof['routes'])
          assert proof['ownerClientData'] is False and proof['androidExecution'] is False and proof['worldEntry'] is False
          PY
      - name: Select provider paths without changing either exact input profile
        env:
          SERVER_INPUT_SOURCE: ${{ needs.selection.outputs.server_source }}
        run: |
          case "$SERVER_INPUT_SOURCE" in
            public-release)
              echo "SERVER_STOCK_PROVIDERS=$RUNNER_TEMP/public-server-providers" >> "$GITHUB_ENV"
              echo "SERVER_HELPER_PROGRAMS_PROVIDER=$RUNNER_TEMP/public-server-providers/programs" >> "$GITHUB_ENV"
              echo "SERVER_DATA_TOOLS_PROVIDER=$RUNNER_TEMP/public-server-providers/data-tools" >> "$GITHUB_ENV"
              ;;
            retained-actions)
              echo "SERVER_STOCK_PROVIDERS=$RUNNER_TEMP/stock-providers" >> "$GITHUB_ENV"
              echo "SERVER_HELPER_PROGRAMS_PROVIDER=$RUNNER_TEMP/helper-programs-providers/programs" >> "$GITHUB_ENV"
              echo "SERVER_DATA_TOOLS_PROVIDER=$RUNNER_TEMP/data-tools-providers/provider" >> "$GITHUB_ENV"
              ;;
            *) exit 2 ;;
          esac
      - name: Restore all four exact public server providers through their frozen source recipe
        if: needs.selection.outputs.server_source == 'public-release'
        run: |
          env -u GITHUB_TOKEN -u GH_TOKEN python3 tools/fetch_local_server_profile.py acquire \
            --packaging-source "$GITHUB_WORKSPACE/server-source-packaging" \
            --output "$RUNNER_TEMP/server-public-inputs" --providers "$RUNNER_TEMP/public-server-providers" \
            > out/coherent-evidence/public-server-acquisition.json
      - name: Acquire qualified complete stock server sources and debug pairs before other large inputs
        if: needs.selection.outputs.server_source == 'retained-actions'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/qualify_server_providers.py acquire --output "$RUNNER_TEMP/stock-inputs" \
            > out/coherent-logs/stock-acquisition.log 2>&1
          cp "$RUNNER_TEMP/stock-inputs/acquisition.json" out/coherent-evidence/stock-acquisition.json
          python3 tools/qualify_server_providers.py build --inputs "$RUNNER_TEMP/stock-inputs" --output "$RUNNER_TEMP/stock-providers" \
            > out/coherent-logs/stock-providers.log 2>&1
          cp "$RUNNER_TEMP/stock-providers/provider-build.json" out/coherent-evidence/stock-provider-build.json
          # Build verified all complete source/debug copies retained under providers.
          rm -rf "$RUNNER_TEMP/stock-inputs"
      - name: Acquire the registered SQL-qualified helper and complete corresponding sources
        if: needs.selection.outputs.server_source == 'retained-actions'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/qualify_playerbots_programs.py acquire --output "$RUNNER_TEMP/helper-programs-inputs" \
            > out/coherent-logs/helper-acquisition.log 2>&1
          cp "$RUNNER_TEMP/helper-programs-inputs/acquisition.json" out/coherent-evidence/helper-acquisition.json
          python3 tools/qualify_playerbots_programs.py build --stock-providers "$RUNNER_TEMP/stock-providers" \
            --inputs "$RUNNER_TEMP/helper-programs-inputs" --output "$RUNNER_TEMP/helper-programs-providers" \
            > out/coherent-logs/helper-providers.log 2>&1
          cp "$RUNNER_TEMP/helper-programs-providers/provider-build.json" out/coherent-evidence/helper-provider-build.json
          # Complete helper/stock sources and debug were copied and verified into
          # the self-contained optional provider. Preserve those copies below.
          rm -rf "$RUNNER_TEMP/helper-programs-inputs"
      - name: Acquire and reproduce qualified composed data tools without a server rebuild
        if: needs.selection.outputs.server_source == 'retained-actions'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/prepare_data_tools_provider.py acquire --output "$RUNNER_TEMP/data-tools-inputs" \
            > out/coherent-logs/data-tools-acquisition.log 2>&1
          cp "$RUNNER_TEMP/data-tools-inputs/acquisition.json" out/coherent-evidence/data-tools-acquisition.json
          python3 tools/prepare_data_tools_provider.py build --inputs "$RUNNER_TEMP/data-tools-inputs" \
            --output "$RUNNER_TEMP/data-tools-providers" > out/coherent-evidence/data-tools-provider-build.json
          # The provider now owns fully verified runtime/source/debug copies.
          rm -rf "$RUNNER_TEMP/data-tools-inputs"
      - name: Read back the exact public cohort once and restore all four providers
        run: |
          python3 tools/fetch_wine_cohort.py \
            --release-lock runtime/wine-cohort-publication/dependency-release.lock.json \
            --publication-receipt runtime/wine-cohort-publication/published-release.json \
            --packaging-source "$GITHUB_WORKSPACE/source-packaging" \
            --output "$RUNNER_TEMP/cohort-inputs" --providers "$RUNNER_TEMP/cohort-providers" \
            > out/coherent-evidence/public-cohort-consumer.json
      - name: Read back the complete Wine source companion before subsequent packaging
        run: |
          python3 tools/fetch_wine_arm64_release.py \
            --release-lock runtime/wine-arm64-publication/dependency-release.lock.json \
            --publication-receipt runtime/wine-arm64-publication/published-release.json \
            --output "$RUNNER_TEMP/coherent-wine-inputs" > out/coherent-evidence/public-wine-consumer.json
          # Keep the unchanged complete original ZIP for the companion artifact.
          # Only this already verified reproducible expanded input tree is removed.
          rm -rf "$RUNNER_TEMP/coherent-wine-inputs/sources-export"
      - name: Acquire the pinned public database dependency runtime once with its entire sources
        run: |
          env -u GITHUB_TOKEN python3 tools/release_server_dependencies.py prepare --output "$RUNNER_TEMP/server-release" \
            > out/coherent-logs/server-dependencies.log 2>&1
          python3 tools/provider_server_runtime.py build --package "$RUNNER_TEMP/server-release" --output "$RUNNER_TEMP/server-provider"
      - name: Build pinned Bionic ARM64 PRoot and matching complete source companion
        run: |
          curl --fail --location --retry 2 --max-time 600 https://github.com/Russianranger/uo-android-launcher/releases/download/v0.2.0/runtime-corresponding-sources.tar.gz -o "$RUNNER_TEMP/proot-original-sources.tar.gz"
          curl --fail --location --retry 2 --retry-all-errors --retry-delay 2 --max-time 900 https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o "$RUNNER_TEMP/android-ndk-r28c-linux.zip"
          python3 tools/build_android_proot.py --sources "$RUNNER_TEMP/proot-original-sources.tar.gz" --ndk-zip "$RUNNER_TEMP/android-ndk-r28c-linux.zip" --work "$RUNNER_TEMP/proot-build"
          python3 tools/verify_android_proot.py --provider "$RUNNER_TEMP/proot-build/provider"
      - name: Install pinned Android command-line tools and complete the already verified NDK
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-combined-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/ndk"
          curl --fail --location --retry 3 --max-time 600 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          # The PRoot builder already verified the complete NDK ZIP hash. Fill
          # missing CMake/build files without overwriting its compiler/runtime.
          unzip -q -n "$RUNNER_TEMP/android-ndk-r28c-linux.zip" -d "$RUNNER_TEMP/proot-build/toolchain"
          ln -s "$RUNNER_TEMP/proot-build/toolchain/android-ndk-r28c" "$ANDROID_HOME/ndk/28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Install Android platform, build tools and CMake
        run: |
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1'
      - name: Clean profile, test core behavior, compile native ARM64 and lint combined app
        run: |
          set -o pipefail
          sha256sum --check gradle/wrapper/SHA256SUMS
          ./gradlew --no-daemon :app:clean :core:check :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:serverProgramsProfileTest \
            -PsourceRevision="${GITHUB_SHA}" -PnativeRuntimeBridge=true -PnativeBridgeAbi=arm64-v8a \
            -PprootProviderDir="$RUNNER_TEMP/proot-build/provider" \
            -PserverRuntimeProviderDir="$RUNNER_TEMP/server-provider" \
            -PguestBridgeProviderDir="$RUNNER_TEMP/cohort-providers/bridge-provider" \
            -PclientRuntimeProviderDir="$RUNNER_TEMP/cohort-providers/client-provider" \
            -PshaderToolsProviderDir="$RUNNER_TEMP/cohort-providers/shader-provider-verified" \
            -PturnipProviderDir="$RUNNER_TEMP/cohort-providers/turnip-provider" \
            -PserverProgramsProfile=playerbots-schema-helper \
            -PserverProgramsProviderDir="$SERVER_HELPER_PROGRAMS_PROVIDER" \
            -PserverDataToolsProviderDir="$SERVER_DATA_TOOLS_PROVIDER" \
            -PserverContentProviderDir="$SERVER_STOCK_PROVIDERS/content" \
            -PclientRuntimeArtifact="$RUNNER_TEMP/cohort-inputs/release/client-original.zip" \
            -PclientRuntimeSource="$GITHUB_WORKSPACE/sources/client" 2>&1 | tee out/coherent-logs/gradle.log
      - name: Exercise actual SDK signing and isolated package identities with an explicit disposable fixture key
        run: |
          umask 077
          SDK_SIGNING_FIXTURE_KEY="$RUNNER_TEMP/esteria-sdk-signing-fixture.jks"
          test ! -e "$SDK_SIGNING_FIXTURE_KEY"
          trap 'rm -f "$SDK_SIGNING_FIXTURE_KEY"' EXIT
          # This disposable identity signs only tiny qualification fixtures.
          # The owner-provisioned persistent project key is never used here.
          keytool -genkeypair -noprompt -keystore "$SDK_SIGNING_FIXTURE_KEY" \
            -storetype JKS -alias androiddebugkey -storepass android -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 1
          ESTERIA_SIGNING_TEST_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" \
          ESTERIA_SIGNING_TEST_DEBUG_KEY="$SDK_SIGNING_FIXTURE_KEY" \
            python3 -m unittest tests.test_android_signing.ActualSdkSigning -v
      - name: Install the complete selected server provider profile on a bounded Java heap
        run: |
          mkdir -p out/java-reference
          javac -cp core/build/classes/java/main -d out/java-reference tests/ServerArchiveInstallReference.java
          for component in programs data-tools content dependencies; do
            case "$component" in
              programs) provider="$SERVER_HELPER_PROGRAMS_PROVIDER" ;;
              data-tools) provider="$SERVER_DATA_TOOLS_PROVIDER" ;;
              content) provider="$SERVER_STOCK_PROVIDERS/content" ;;
              dependencies) provider="$RUNNER_TEMP/server-provider" ;;
            esac
            python3 tools/qualify_server_providers.py java-manifest --provider "$provider" \
              --output "out/coherent-evidence/java-$component.tsv" > "out/coherent-evidence/java-$component-input.json"
            archive=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["archive"])' "out/coherent-evidence/java-$component-input.json")
            java -Xmx32m -cp core/build/classes/java/main:out/java-reference ServerArchiveInstallReference \
              "out/coherent-evidence/java-$component.tsv" "$archive" "$RUNNER_TEMP/local-game-java-store" \
              > "out/coherent-evidence/java-$component.json"
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          directory=Path('out/coherent-evidence')
          components={name:json.loads((directory/('java-'+name+'.json')).read_bytes())
              for name in ('programs','data-tools','content','dependencies')}
          for result in components.values():
              assert result['scope']=='host-java-exact-server-archive-install-and-cached-reuse'
              assert result['firstCopiedBytes']==result['fileBytes'] and result['cachedCopiedBytes']==0
              assert result['cachedArchiveRequired'] is False
              assert result['androidRuntimeQualified'] is False and result['gameplayQualified'] is False
          assert len({result['packageKey'] for result in components.values()})==4
          proof=dict(formatVersion=1,scope='host-java-four-component-local-game-profile-install-cache-only',
              integrationRevision=os.environ['GITHUB_SHA'],components=components,
              sharedPrivateStore=True,javaMaximumHeapBytes=32*1024**2,
              actualCopiedFileBytes=sum(row['firstCopiedBytes'] for row in components.values()),
              originalArchiveRequiredForCachedReuse=False,serverProgramsExecuted=False,sqlExecuted=False,
              androidRuntimeQualified=False,localWorldReadinessQualified=False,gameplayQualified=False)
          (directory/'java-server-profile.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          PY
      - name: Verify every provider helper native ABI and selected source profile in the actual APK
        id: verified
        run: |
          python3 tools/verify_wine_cohort_apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --cohort-release "$RUNNER_TEMP/cohort-inputs/release" \
            --release-lock runtime/wine-cohort-publication/dependency-release.lock.json \
            --packaging-source "$GITHUB_WORKSPACE/source-packaging" \
            --proot-provider "$RUNNER_TEMP/proot-build/provider" \
            --proot-sources "$RUNNER_TEMP/proot-build/proot-corresponding-source.tar.gz" \
            --ndk-archive "$RUNNER_TEMP/android-ndk-r28c-linux.zip" \
            --server-providers "$SERVER_STOCK_PROVIDERS" --dependency-provider "$RUNNER_TEMP/server-provider" \
            --server-profile local-game \
            --playerbots-programs-provider "$SERVER_HELPER_PROGRAMS_PROVIDER" \
            --data-tools-provider "$SERVER_DATA_TOOLS_PROVIDER" \
            --output out/coherent-evidence/coherent-apk.json
          git archive --format=tar.gz --output="$RUNNER_TEMP/coherent-integration-source.tar.gz" "$GITHUB_SHA"
      - name: Retain the unqualified complete-provider APK and exact source-selection proof
        if: steps.verified.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unqualified-local-game-profile-arm64-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            out/coherent-evidence/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Retain complete provider cohort source companions and original inputs unchanged
        if: steps.verified.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-game-wine-cohort-originals-${{ github.sha }}
          path: ${{ runner.temp }}/cohort-inputs/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Retain entire original Wine corresponding-source ZIP separately
        if: steps.verified.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-game-wine-full-original-sources-${{ github.sha }}
          path: |
            ${{ runner.temp }}/coherent-wine-inputs/sources.zip
            ${{ runner.temp }}/coherent-wine-inputs/input-evidence.json
            ${{ runner.temp }}/coherent-wine-inputs/publication/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Retain complete database dependency source companion
        if: steps.verified.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-game-server-dependency-sources-${{ github.sha }}
          path: |
            ${{ runner.temp }}/server-release/server-runtime-corresponding-sources.zip
            ${{ runner.temp }}/server-release/server-runtime-source-manifest.json
            ${{ runner.temp }}/server-release/release-manifest.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Retain complete helper and original program sources and paired debug outside APK assets
        if: steps.verified.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-game-helper-program-source-debug-${{ github.sha }}
          path: ${{ env.SERVER_HELPER_PROGRAMS_PROVIDER }}/sources/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Retain complete stock extractor sources and paired debug outside APK assets
        if: steps.verified.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-game-original-stock-extractors-source-debug-${{ github.sha }}
          path: ${{ env.SERVER_STOCK_PROVIDERS }}/extractors/sources/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Retain complete composed reader sources and paired debug outside APK assets
        if: steps.verified.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-game-data-tools-source-debug-${{ github.sha }}
          path: ${{ env.SERVER_DATA_TOOLS_PROVIDER }}/sources/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Retain original PRoot source and exact current integration source
        if: steps.verified.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-game-integration-proot-sources-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proot-build/proot-corresponding-source.tar.gz
            ${{ runner.temp }}/coherent-integration-source.tar.gz
            ${{ runner.temp }}/proot-build/build-evidence.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Build and lint an unsigned release from the same complete provider profile
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os,re
          from tools import sign_android_apk as signing
          value=os.environ['RELEASE_VERSION_CODE']
          assert re.fullmatch('[1-9][0-9]{0,9}',value), 'release-version-code-format'
          signing.version(int(value))
          PY
          env -u ESTERIA_KEYSTORE_PATH -u ESTERIA_KEYSTORE_PASSWORD -u ESTERIA_KEY_ALIAS -u ESTERIA_KEY_PASSWORD \
            ./gradlew --no-daemon :app:assembleRelease :app:lintRelease \
            -PbuildVersionCode="$RELEASE_VERSION_CODE" \
            -PsourceRevision="${GITHUB_SHA}" -PnativeRuntimeBridge=true -PnativeBridgeAbi=arm64-v8a \
            -PprootProviderDir="$RUNNER_TEMP/proot-build/provider" \
            -PserverRuntimeProviderDir="$RUNNER_TEMP/server-provider" \
            -PguestBridgeProviderDir="$RUNNER_TEMP/cohort-providers/bridge-provider" \
            -PclientRuntimeProviderDir="$RUNNER_TEMP/cohort-providers/client-provider" \
            -PshaderToolsProviderDir="$RUNNER_TEMP/cohort-providers/shader-provider-verified" \
            -PturnipProviderDir="$RUNNER_TEMP/cohort-providers/turnip-provider" \
            -PserverProgramsProfile=playerbots-schema-helper \
            -PserverProgramsProviderDir="$SERVER_HELPER_PROGRAMS_PROVIDER" \
            -PserverDataToolsProviderDir="$SERVER_DATA_TOOLS_PROVIDER" \
            -PserverContentProviderDir="$SERVER_STOCK_PROVIDERS/content" \
            -PclientRuntimeArtifact="$RUNNER_TEMP/cohort-inputs/release/client-original.zip" \
            -PclientRuntimeSource="$GITHUB_WORKSPACE/sources/client" 2>&1 | tee out/coherent-logs/gradle-release.log
      - name: Verify release provider bytes and nondebug unsigned APK identity without a key
        id: release_verified
        run: |
          mkdir -p out/coherent-release-evidence
          python3 tools/verify_wine_cohort_apk.py \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --cohort-release "$RUNNER_TEMP/cohort-inputs/release" \
            --release-lock runtime/wine-cohort-publication/dependency-release.lock.json \
            --packaging-source "$GITHUB_WORKSPACE/source-packaging" \
            --proot-provider "$RUNNER_TEMP/proot-build/provider" \
            --proot-sources "$RUNNER_TEMP/proot-build/proot-corresponding-source.tar.gz" \
            --ndk-archive "$RUNNER_TEMP/android-ndk-r28c-linux.zip" \
            --server-providers "$SERVER_STOCK_PROVIDERS" --dependency-provider "$RUNNER_TEMP/server-provider" \
            --server-profile local-game \
            --playerbots-programs-provider "$SERVER_HELPER_PROGRAMS_PROVIDER" \
            --data-tools-provider "$SERVER_DATA_TOOLS_PROVIDER" \
            --output out/coherent-release-evidence/coherent-release-apk.json
          python3 - <<'PY'
          import json,os,re,zipfile
          from pathlib import Path
          from tools import sign_android_apk as signing
          apk=Path('app/build/outputs/apk/release/app-release-unsigned.apk')
          tools=signing.sdk_tools(Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0')
          manifest=signing.manifest(apk,tools,signing.version(int(os.environ['RELEASE_VERSION_CODE'])),signing.STOCK_PACKAGE)
          assert manifest['debuggable'] is False, 'release-apk-must-not-be-debuggable'
          with zipfile.ZipFile(apk) as archive:
              assert not any(re.fullmatch(r'META-INF/[^/]+\.(SF|RSA|DSA|EC)',name,re.I)
                  for name in archive.namelist()), 'release-apk-has-v1-signature'
              central=archive.start_dir
          with apk.open('rb') as stream:
              stream.seek(max(0,central-16))
              assert stream.read(16)!=b'APK Sig Block 42', 'release-apk-has-signing-block'
          target=Path('out/coherent-release-evidence')
          (target/'release-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          cohort=json.loads((target/'coherent-release-apk.json').read_bytes())
          assert cohort['completeAssetInventoryVerified'] is True and cohort['exactCurrentHelperClosureVerified'] is True
          assert cohort['serverProfile']=='local-game' and cohort['deviceTestCandidate'] is False
          identity=dict(bytes=apk.stat().st_size,sha256=signing.digest(apk))
          assert identity==cohort['apk'], 'release-apk-byte-verifier-identity-differs'
          proof=dict(formatVersion=1,scope='unsigned-nondebug-local-game-profile-release-packaging-only',
              integrationRevision=os.environ['GITHUB_SHA'],apk=identity,manifest=manifest,
              completeProviderAndSourceBytesVerified=True,unsignedSignatureStructureVerified=True,
              debugReferenceArtifactRetainedSeparately=True,sourceAndPairedDebugCompanionsRetainedSeparately=True,
              privateSigningPerformed=False,persistentSigningQualified=False,releaseInstallationQualified=False,
              androidExecutionQualified=False,hardwareQualified=False,commonMainQualified=False,
              gameLoginQualified=False,localWorldReadinessQualified=False,playerbotsAiQualified=False,
              gameplayQualified=False,deviceTestCandidate=False)
          (target/'unsigned-release-package.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          assert {path.name for path in target.iterdir()}=={
              'coherent-release-apk.json','release-manifest.json','unsigned-release-package.json'}
          assert all(path.is_file() and path.stat().st_size<=2<<20 for path in target.iterdir())
          assert apk.stat().st_size+sum(path.stat().st_size for path in target.iterdir())<500_000_000, 'release-apk-and-evidence-must-fit-bounded-artifact'
          PY
      - name: Retain the separately verified unsigned release APK and bounded release proof
        if: steps.release_verified.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-local-game-profile-release-arm64-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            out/coherent-release-evidence/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Sign only with the configured persistent identity and preserve the unsigned input
        id: stock_signed
        if: steps.release_verified.outcome == 'success' && (inputs.publish_non_custom == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish non-custom]')))
        env:
          ESTERIA_KEYSTORE_BASE64: ${{ secrets.ESTERIA_KEYSTORE_BASE64 }}
          ESTERIA_KEYSTORE_PASSWORD: ${{ secrets.ESTERIA_KEYSTORE_PASSWORD }}
          ESTERIA_KEY_PASSWORD: ${{ secrets.ESTERIA_KEY_PASSWORD }}
          ESTERIA_KEY_ALIAS: ${{ secrets.ESTERIA_KEY_ALIAS }}
        run: |
          python3 tools/sign_non_custom_ci.py --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --version-code "$RELEASE_VERSION_CODE" --private-directory "$RUNNER_TEMP/stock-signing-private" \
            --output out/non-custom-signed
      - name: Retain signed non-custom APK and exact signing receipt
        if: steps.stock_signed.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-non-custom-arm64-${{ github.sha }}
          path: out/non-custom-signed/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Publish one additive labelled stock prerelease
        if: steps.stock_signed.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/prepare_non_custom_release.py --signed out/non-custom-signed \
            --cohort-proof out/coherent-release-evidence/coherent-release-apk.json \
            --app-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output out/non-custom-release
          tag=$(python3 -c 'import json;print(json.load(open("out/non-custom-release/release.json"))["tag"])')
          # This is additive. An existing tag/release is never overwritten.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo 'Non-custom tag already exists; refusing publication.'
            exit 2
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Esteria Stock 3.3.5a / non-custom" \
            --notes-file out/non-custom-release/RELEASE-NOTES.md \
            out/non-custom-release/Esteria-Stock-3.3.5a-arm64.apk \
            out/non-custom-release/SHA256SUMS out/non-custom-release/release.json \
            out/non-custom-signed/signing-receipt.json NON-CUSTOM-TESTING.md
      - name: Preserve bounded diagnostics after success or failure
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target=Path('out/coherent-evidence');target.mkdir(parents=True,exist_ok=True)
          for path in Path('out/coherent-logs').glob('*.log'):
            with path.open('rb') as stream:
              stream.seek(max(0,path.stat().st_size-256*1024))
              (target/(path.stem+'-tail.log')).write_bytes(stream.read(256*1024))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-game-provider-evidence-${{ github.sha }}
          path: out/coherent-evidence/
          retention-days: 30
          if-no-files-found: warn
