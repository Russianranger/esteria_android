name: Native Android stock shader preparation
on:
  push:
    branches: [qa/android-arm64-shader-v19]
permissions:
  contents: read
  actions: read
jobs:
  boot:
    if: github.repository == 'Russianranger/esteria_android' && contains(github.event.head_commit.message, '[boot native Android]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Boot pinned, offline ARM64 Android and query PackageManager
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/esteria-boot.XXXXXX")
          source tools/android_stock_shader/redroid.sh
          trap 'redroid_stop "$work"' EXIT
          redroid_start "$work"
          echo "SDK=$(docker exec "$redroid_name" /system/bin/getprop ro.build.version.sdk)"
          echo "ABI=$(docker exec "$redroid_name" /system/bin/getprop ro.product.cpu.abi)"
          echo "SELinux=$(docker exec "$redroid_name" /system/bin/getenforce)"
          echo 'PackageManager and installed app_process64 are ready with loopback only'
  cold:
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(contains(github.event.head_commit.message, '[fresh only]') && '["fresh"]' || contains(github.event.head_commit.message, '[legacy only]') && '["legacy"]' || '["fresh","legacy"]') }}
    if: github.repository == 'Russianranger/esteria_android' && (contains(github.event.head_commit.message, '[qualify native Android shaders]') || contains(github.event.head_commit.message, '[qualify installed Android shader repair]') || contains(github.event.head_commit.message, '[replay v13 shader failure]'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 17506ec8df7a57847d72b03f3972d8eee88d4a45
          path: detached-proof
          sparse-checkout: runtime/releases/non-custom/update-19
          persist-credentials: false
      - name: Restore the measured v19 signature over the original unsigned CI producer
        shell: bash
        env:
          ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/stock-detached.XXXXXXXX")
          test "$(git -C detached-proof rev-parse HEAD)" = 17506ec8df7a57847d72b03f3972d8eee88d4a45
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $ARTIFACT_TOKEN" \
            https://api.github.com/repos/Russianranger/esteria_android/actions/artifacts/13609629822/zip \
            -o "$work/package.zip"
          unset ARTIFACT_TOKEN
          bash tools/android_stock_shader/restore_candidate.sh "$work/package.zip" \
            detached-proof/runtime/releases/non-custom/update-19 "$work"
          echo "ESTERIA_DETACHED_CANDIDATE=$work/signed.apk" >> "$GITHUB_ENV"
      - name: Fetch the fixed ARM64 Temurin JDK through its release asset API
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/stock-java17"
          archive="$RUNNER_TEMP/pinned-aarch64-jdk.tgz"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 180 \
            -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/adoptium/temurin17-binaries/releases/assets/199779632?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -o "$archive"
          echo "0c17fa4f14c0d2cc9e9334f996fccdddc5da4459d768f3105c7ff0283c47bf62  $archive" | sha256sum -c
          mkdir "$sdk"
          tar xzf "$archive" --strip-components=1 -C "$sdk"
          "$sdk/bin/javac" -version | grep -Fx 'javac 17.0.13'
          echo "JAVA_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - name: Stage Android platform 35, portable D8 and host FUSE
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/stock-shader-sdk"
          mkdir -p "$sdk/platforms" "$sdk/build-tools"
          tools_url=https://dl.google.com/android/repository
          curl --fail --location --retry 3 "$tools_url/platform-35_r02.zip" -o "$RUNNER_TEMP/stock-sdk.zip"
          curl --fail --location --retry 3 "$tools_url/build-tools_r35_linux.zip" -o "$RUNNER_TEMP/stock-build-tools.zip"
          echo "0bb560a90a7a2cbd0dd8348224d518b638fe7949  $RUNNER_TEMP/stock-sdk.zip" | sha1sum -c
          echo "2cfaa0bbb2336e9ec18ed3ecea84fa2e2af607bc  $RUNNER_TEMP/stock-build-tools.zip" | sha1sum -c
          unzip -q "$RUNNER_TEMP/stock-sdk.zip" -d "$sdk/platforms"
          unzip -q "$RUNNER_TEMP/stock-build-tools.zip" -d "$sdk/build-tools"
          platform=$(find "$sdk/platforms" -mindepth 1 -maxdepth 1 -type d)
          build=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d)
          if [[ "$platform" != "$sdk/platforms/android-35" ]]; then mv "$platform" "$sdk/platforms/android-35"; fi
          if [[ "$build" != "$sdk/build-tools/35.0.0" ]]; then mv "$build" "$sdk/build-tools/35.0.0"; fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/d8"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-fusepy libfuse2t64
      - name: Install signed stock APK and exercise offline cold and warm owners
        env:
          ESTERIA_LEGACY_SHADER_REPAIR: ${{ matrix.scenario == 'legacy' }}
          PUBLIC_RELEASE_TOKEN: ${{ github.token }}
          ESTERIA_EXERCISE_NAMED_REPAIR: ${{ contains(github.event.head_commit.message, '[qualify installed Android shader repair]') }}
        run: bash tools/android_stock_shader/host_run.sh
      - name: Publish safe counts, source identities and phase results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-stock-shader-evidence-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/android-stock-shader-evidence/host.json
            ${{ runner.temp }}/android-stock-shader-evidence/package.json
            ${{ runner.temp }}/android-stock-shader-evidence/source.json
            ${{ runner.temp }}/android-stock-shader-evidence/owner.json
            ${{ runner.temp }}/android-stock-shader-evidence/repair.json
          retention-days: 7
          if-no-files-found: warn
