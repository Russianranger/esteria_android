name: Replay the stock launcher interface fixture
on:
  workflow_dispatch:
  push:
    branches: [non-custom]
    paths: [.github/workflows/stock-launcher-interface.yml, tools/retained_database/launcher_export.py]
permissions:
  contents: read
  actions: read
jobs:
  interface:
    if: github.ref == 'refs/heads/non-custom' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[check launcher interface]'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e9553fe7f0035a3336693046368c6ad7034ab344
          path: previous-qa
          sparse-checkout: tools/android_stock_shader
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 42515863957
          name: unqualified-local-game-profile-arm64-21f6a4f73082d7b1830ec73319f9289cb98085a8
          path: package
      - name: Exercise the original v23 widgets on offline Android 13 ARM64
        run: |
          set -euo pipefail
          source previous-qa/tools/android_stock_shader/redroid.sh
          work=$(mktemp -d "$RUNNER_TEMP/stock-interface.XXXXXXXX")
          mkdir -p "$work/input" evidence
          cp package/app/build/outputs/apk/debug/app-debug.apk "$work/input/app.apk"
          cp package/app/build/outputs/apk/androidTest/debug/*-androidTest.apk "$work/input/tests.apk"
          chmod 755 "$work/input"; chmod 644 "$work/input/"*
          trap 'redroid_stop "$work"' EXIT
          redroid_start "$work"
          for apk in app tests; do
            docker exec "$redroid_name" cp "/esteria-qa/input/$apk.apk" "/data/local/tmp/$apk.apk"
            docker exec "$redroid_name" chmod 644 "/data/local/tmp/$apk.apk"
            docker exec "$redroid_name" pm install -t --user 0 "/data/local/tmp/$apk.apk" | grep -Fx Success
          done
          python3 tools/retained_database/android_platform.py evidence/interface.txt
          python3 tools/retained_database/launcher_export.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-interface-replay
          path: evidence/
          if-no-files-found: warn
