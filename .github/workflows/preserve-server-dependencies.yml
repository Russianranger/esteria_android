name: Preserve measured server dependencies
on:
  workflow_dispatch:
  push:
    branches: [android/client-server]
    paths:
      - runtime/server/dependency-release.lock.json
      - tools/release_server_dependencies.py
      - tests/test_dependency_release.py
      - .github/workflows/preserve-server-dependencies.yml
permissions:
  contents: read
concurrency:
  group: preserve-measured-server-dependencies
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test validation and write-once behavior
        run: python3 -m unittest tests.test_dependency_release -v
      - name: Recover exact originals and validate complete dependency/source inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_server_dependencies.py prepare \
            --inputs out/original-artifacts --output out/release-candidate
      - name: Transfer only validated dependency/source release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-server-dependency-release
          path: out/release-candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: validate
    if: github.repository == 'Russianranger/esteria_android' && github.ref == 'refs/heads/android/client-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-server-dependency-release
          path: out/release-candidate
      - name: Verify stored bytes, preserve exact tag/assets, publish dependency-only prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_server_dependencies.py publish \
            --inputs out/release-candidate --output out/published-release.json
      - name: Retain actual durable URLs and server-reported immutability
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-dependency-publication-receipt
          path: out/published-release.json
          if-no-files-found: error
          retention-days: 14
