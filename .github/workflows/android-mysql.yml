name: Android 13 x86_64 MySQL bootstrap and restart
on:
  push:
    branches: [android/client-server]
    paths:
      - runtime/mysql-probe/**
      - runtime/mysql_bootstrap.py
      - runtime/mysql_service.py
      - runtime/android_database_setup.py
      - runtime/server/ubuntu.sources
      - runtime/server/inrelease.SHA256SUMS
      - runtime/proot/**
      - native/proot-probe/**
      - tools/build_android_proot.py
      - tools/build_android_proot_probe.py
      - tools/verify_android_proot_probe.py
      - app/mysql-probe.gradle
      - app/database-setup.gradle
      - app/database-service.gradle
      - app/src/main/java/io/github/russianranger/esteria/runtime/ServerDatabaseService.java
      - app/src/main/java/io/github/russianranger/esteria/runtime/GuestHelperAssets.java
      - app/src/androidTest/**/MySqlExecutionTest.java
      - tools/*android_mysql*.py
      - tests/test_android_mysql_probe.py
      - .github/workflows/android-mysql.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-mysql-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Check target isolation and create evidence directory
        run: |
          test "$(uname -m)" = x86_64
          python3 -m unittest tests.test_android_mysql_probe tests.test_android_database_setup -v
          mkdir -p out/android-mysql
      - name: Build the exact fresh Ubuntu x64 dependency image
        id: runtime
        run: |
          docker build --platform linux/amd64 --target runtime -f runtime/mysql-probe/Dockerfile \
            --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt \
            -t esteria-mysql-probe:qualification . > out/android-mysql/image-build.log 2>&1
      - name: Package and read back a rootfs without database state
        run: |
          container=$(docker create esteria-mysql-probe:qualification)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/etc/esteria-mysql-probe.json" out/android-mysql/runtime.json
          docker export "$container" > out/mysql-export.tar
          python3 tools/build_android_mysql_probe.py --docker-export out/mysql-export.tar \
            --runtime-metadata out/android-mysql/runtime.json --output out/mysql-provider \
            > out/android-mysql/provider-build.json
          rm out/mysql-export.tar
      - name: Enable KVM for the disposable emulator
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exact Android command-line tools and pinned toolchain
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          export PATH="$ANDROID_HOME/cmdline-tools/12.0/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Build the separate source-pinned x86_64 probe provider
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from tools.prepare_runtime import fetch
          lock=json.loads(Path('runtime/proot/sources.lock.json').read_text())
          fetch(lock['source'],Path(os.environ['RUNNER_TEMP'])/'probe-cache')
          PY
          python3 tools/build_android_proot_probe.py --sources "$RUNNER_TEMP/probe-cache/runtime-corresponding-sources.tar.gz" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --cache "$RUNNER_TEMP/probe-cache" --download --work "$RUNNER_TEMP/proot-probe"
          python3 tools/verify_android_proot_probe.py --provider "$RUNNER_TEMP/proot-probe/provider"
      - name: Build the isolated MySQL fixture APK and verify exact packaged bytes
        run: |
          sha256sum --check gradle/wrapper/SHA256SUMS
          python3 tools/verify_android_mysql_probe.py --provider out/mysql-provider --proot-provider "$RUNNER_TEMP/proot-probe/provider"
          ./gradlew --no-daemon :app:clean :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug \
            -PnativeRuntimeBridge=true -PnativeBridgeAbi=x86_64 -PprootProbeProviderDir="$RUNNER_TEMP/proot-probe/provider" \
            -PmysqlProbeProviderDir="$GITHUB_WORKSPACE/out/mysql-provider" -PsourceRevision="$GITHUB_SHA"
          cp app/build/outputs/apk/debug/app-debug.apk out/android-mysql/probe.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/android-mysql/tests.apk
          python3 tools/verify_android_mysql_probe.py --provider out/mysql-provider --proot-provider "$RUNNER_TEMP/proot-probe/provider" \
            --apk out/android-mysql/probe.apk > out/android-mysql/apk-verification.json
      - name: Execute real bootstrap, SQL authentication and persistent restart on Android13
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/qualify_android_mysql.py --apk out/android-mysql/probe.apk --test-apk out/android-mysql/tests.apk --provider out/mysql-provider --proot-provider "$RUNNER_TEMP/proot-probe/provider" --source-revision "$GITHUB_SHA" --output out/android-mysql/evidence
      - name: Publish bounded emulator diagnostics before source export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-13-x64-mysql-early-evidence-${{ github.sha }}
          path: out/android-mysql/evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Retain complete installed-package corresponding sources even after a test failure
        if: always() && steps.runtime.outcome == 'success'
        run: |
          docker build --platform linux/amd64 --target source-export -f runtime/mysql-probe/Dockerfile \
            --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt \
            --output type=local,dest=out/mysql-sources . > out/android-mysql/source-build.log 2>&1
          cp out/mysql-sources/SOURCE-MANIFEST.json out/android-mysql/source-manifest.json
      - name: Make only disposable evidence/source output readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-13-x64-mysql-evidence-${{ github.sha }}
          path: |
            out/android-mysql/*.json
            out/android-mysql/*.log
            out/android-mysql/evidence
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.runtime.outcome == 'success'
        with:
          name: android-x64-mysql-fixture-sources-${{ github.sha }}
          path: |
            out/mysql-sources
            runtime/mysql-probe
            runtime/mysql_bootstrap.py
            runtime/mysql_service.py
            runtime/android_database_setup.py
            runtime/server/capture_sources.py
            runtime/server/ubuntu.sources
            runtime/server/inrelease.SHA256SUMS
            tools/*android_mysql*.py
            tools/package_server_runtime.py
            tools/prepare_runtime.py
            app/mysql-probe.gradle
            app/database-setup.gradle
            app/database-service.gradle
            app/src/main/java/io/github/russianranger/esteria/runtime/ServerDatabaseService.java
            app/src/main/java/io/github/russianranger/esteria/runtime/GuestHelperAssets.java
            app/src/androidTest/java/io/github/russianranger/esteria/runtime/MySqlExecutionTest.java
            ${{ runner.temp }}/proot-probe/corresponding-source.tar.gz
            LICENSE
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
