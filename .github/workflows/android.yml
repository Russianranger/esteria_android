name: Android launcher and host behavior checks
on:
  push:
    branches: [android/client-server]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Install Android command-line tools explicitly
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Install pinned Android platform and build tools
        run: |
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify wrapper and source behavior, compile launcher, run Android lint
        run: |
          sha256sum --check gradle/wrapper/SHA256SUMS
          ./gradlew --no-daemon :core:check :app:assembleDebug :app:lintDebug -PsourceRevision="${GITHUB_SHA}"
      - name: Upload internal CI evidence (not a gameplay candidate)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unqualified-launcher-ci-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
          retention-days: 14
      - name: Build signed development package only with the persistent project key
        env:
          ESTERIA_KEYSTORE_BASE64: ${{ secrets.ESTERIA_KEYSTORE_BASE64 }}
          ESTERIA_KEYSTORE_PASSWORD: ${{ secrets.ESTERIA_KEYSTORE_PASSWORD }}
          ESTERIA_KEY_PASSWORD: ${{ secrets.ESTERIA_KEY_PASSWORD }}
          ESTERIA_KEY_ALIAS: ${{ secrets.ESTERIA_KEY_ALIAS }}
        run: |
          if [ -z "$ESTERIA_KEYSTORE_BASE64" ]; then
            echo 'Persistent signing key is not configured; no signed update candidate is produced.'
            exit 0
          fi
          export ESTERIA_KEYSTORE_PATH="$RUNNER_TEMP/esteria-development.jks"
          trap 'rm -f "$ESTERIA_KEYSTORE_PATH"' EXIT
          printf '%s' "$ESTERIA_KEYSTORE_BASE64" | base64 --decode > "$ESTERIA_KEYSTORE_PATH"
          chmod 600 "$ESTERIA_KEYSTORE_PATH"
          ./gradlew --no-daemon :app:assembleRelease -PsourceRevision="${GITHUB_SHA}"
      - name: Upload signed internal build if available
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-unqualified-development-${{ github.sha }}
          path: app/build/outputs/apk/release/*-release.apk
          if-no-files-found: ignore
          retention-days: 14
