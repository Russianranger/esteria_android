name: Android 13 x86_64 PRoot and glibc probe
on:
  push:
    branches: [android/client-server]
    paths:
      - native/proot-probe/**
      - native/process-owner/**
      - runtime/proot/**
      - app/proot-probe.gradle
      - app/build.gradle
      - app/src/androidTest/**/ProotExecutionTest.java
      - app/src/androidTest/**/ProbeProcessHandles.java
      - app/src/androidTest/**/RemoteOwnerDeathProbe.java
      - app/src/prootProbe/**
      - native/CMakeLists.txt
      - tools/build_android_proot_probe.py
      - tools/verify_android_proot_probe.py
      - tools/qualify_android_proot.py
      - tools/check_proot_probe_pidfd.py
      - tests/test_android_proot_probe.py
      - .github/workflows/android-proot-execution.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-proot-execution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  proot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Enable KVM for the disposable emulator
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exact Android command-line tools and pinned toolchain
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          export PATH="$ANDROID_HOME/cmdline-tools/12.0/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Build the separate source-pinned x86_64 probe provider
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from tools.prepare_runtime import fetch
          lock=json.loads(Path('runtime/proot/sources.lock.json').read_text())
          fetch(lock['source'],Path(os.environ['RUNNER_TEMP'])/'probe-cache')
          PY
          python3 tools/build_android_proot_probe.py --sources "$RUNNER_TEMP/probe-cache/runtime-corresponding-sources.tar.gz" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --cache "$RUNNER_TEMP/probe-cache" --download --work "$RUNNER_TEMP/proot-probe"
          python3 tools/verify_android_proot_probe.py --provider "$RUNNER_TEMP/proot-probe/provider"
      - name: Build and verify mandatory owner and private Linux fixture APK
        run: |
          mkdir -p out/android-proot
          sha256sum --check gradle/wrapper/SHA256SUMS
          ESTERIA_PROOT_PROBE_PROVIDER="$RUNNER_TEMP/proot-probe/provider" python3 -m unittest tests.test_android_proot_probe tests.test_android_installer_qualification -v
          python3 tools/check_proot_probe_pidfd.py
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PnativeRuntimeBridge=true -PnativeBridgeAbi=x86_64 -PprootProbeProviderDir="$RUNNER_TEMP/proot-probe/provider" -PsourceRevision="$GITHUB_SHA"
          cp app/build/outputs/apk/debug/app-debug.apk out/android-proot/probe.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/android-proot/tests.apk
          python3 tools/verify_android_proot_probe.py --provider "$RUNNER_TEMP/proot-probe/provider" --apk out/android-proot/probe.apk
      - name: Ensure ordinary owner APK excludes all probe components
        run: |
          ./gradlew --no-daemon :app:clean :app:assembleDebug -PnativeRuntimeBridge=true -PnativeBridgeAbi=x86_64 -PsourceRevision="$GITHUB_SHA"
          python3 tools/verify_android_proot_probe.py --owner-only-apk app/build/outputs/apk/debug/app-debug.apk > out/android-proot/ordinary-inventory.json
      - name: Execute actual PRoot loader and glibc from app-private storage
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/qualify_android_proot.py --apk out/android-proot/probe.apk --test-apk out/android-proot/tests.apk --provider "$RUNNER_TEMP/proot-probe/provider" --source-revision "$GITHUB_SHA" --output out/android-proot/evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-13-x64-proot-evidence-${{ github.sha }}
          path: |
            out/android-proot/evidence
            out/android-proot/ordinary-inventory.json
            ${{ runner.temp }}/proot-probe/build-evidence.json
            ${{ runner.temp }}/proot-probe/build.log
            ${{ runner.temp }}/proot-probe/control-build.log
            ${{ runner.temp }}/proot-probe/guest-build.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-13-x64-proot-corresponding-source-${{ github.sha }}
          path: ${{ runner.temp }}/proot-probe/corresponding-source.tar.gz
          if-no-files-found: warn
          retention-days: 14
