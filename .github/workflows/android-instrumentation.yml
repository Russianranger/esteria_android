name: Android 13 installer and APK update
on:
  push:
    branches: [non-custom]
    paths:
      - app/**
      - core/**
      - gradle.properties
      - tools/qualify_android_installer.py
      - tests/test_android_installer_qualification.py
      - .github/workflows/android-instrumentation.yml
  pull_request:
    paths:
      - app/**
      - core/**
      - gradle.properties
      - tools/qualify_android_installer.py
      - tests/test_android_installer_qualification.py
      - .github/workflows/android-instrumentation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Enable runner KVM for the disposable emulator
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android command-line tools explicitly
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Install pinned Android platform and build tools
        run: |
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build both update versions with the same isolated CI debug key
        run: |
          mkdir -p out/android-installer
          sha256sum --check gradle/wrapper/SHA256SUMS
          python3 -m unittest tests.test_android_installer_qualification -v
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PbuildVersionCode=1 -PsourceRevision="$GITHUB_SHA"
          cp app/build/outputs/apk/debug/app-debug.apk out/android-installer/initial.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/android-installer/tests.apk
          ./gradlew --no-daemon :app:assembleDebug -PbuildVersionCode=2 -PsourceRevision="$GITHUB_SHA"
          cp app/build/outputs/apk/debug/app-debug.apk out/android-installer/update.apk
      - name: Prepare bounded stock shader and helper component readback
        run: |
          cat > out/android-installer/stock-shader-component.py <<'PY'
          import hashlib, json, os, pathlib, re
          from tools.qualify_android_installer import run_bounded, digest, PACKAGE
          root = pathlib.Path.cwd()
          destination = root / 'out/android-installer/evidence'
          selected = 'io.github.russianranger.esteria.runtime.ShaderSetupReceiptTest'
          if PACKAGE != 'io.github.russianranger.esteria.stock':
              raise RuntimeError('Stock component target package differs')
          installer = json.loads((destination / 'qualification.json').read_text())
          properties = installer['emulatorProperties']
          if (properties['ro.kernel.qemu'], properties['ro.build.version.sdk'], properties['ro.product.cpu.abi']) != ('1', '33', 'x86_64'):
              raise RuntimeError('Stock component requires the same disposable Android13 x64 emulator')
          files = ['app/src/androidTest/java/io/github/russianranger/esteria/runtime/ShaderSetupReceiptTest.java',
                   'app/src/androidTest/java/io/github/russianranger/esteria/runtime/ServerSessionAssetsTest.java',
                   'app/src/main/java/io/github/russianranger/esteria/runtime/ShaderSetup.java',
                   'app/src/main/java/io/github/russianranger/esteria/runtime/StockClientSetup.java',
                   'core/src/main/java/io/github/russianranger/esteria/core/runtime/process/ShaderRunPlan.java',
                   'app/stock-client.gradle', 'runtime/stock_shader_generation.py']
          receipt = dict(formatVersion=1, scope='android13-x64-stock-helper-and-synthetic-shader-receipt-components',
              appSourceRevision=os.environ['GITHUB_SHA'], contentProfile='stock-3.3.5a',
              testClass=selected, expectedTests=2, emulatorProperties=properties,
              artifacts=installer['artifacts'],
              sources={name: dict(bytes=(root / name).stat().st_size, sha256=digest(root / name)) for name in files},
              componentTestsExecuted=False, componentTestsPassed=False,
              stockHelperAssetsQualified=False, syntheticShaderReceiptGuardsQualified=False,
              gameDataDecoded=False, shaderCompilerExecuted=False, shaderRenderingQualified=False,
              clientStarted=False, authWorldSessionExecuted=False, androidArm64Qualified=False,
              thorQualified=False, gameplayQualified=False)
          log = destination / 'stock-shader-component.log'
          try:
              code, output = run_bounded(['adb', 'shell', 'am', 'instrument', '-w', '-r', '-e', 'class',
                  selected, PACKAGE + '.test/androidx.test.runner.AndroidJUnitRunner'], log, 600, 256 * 1024)
              receipt.update(componentTestsExecuted=True, processExitCode=code)
              passed = code == 0 and bool(re.search(r'^OK \(2 tests\)\s*$', output, re.M)) and bool(
                  re.search(r'^INSTRUMENTATION_CODE: -1\s*$', output, re.M)) and not re.search(
                  r'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|INSTRUMENTATION_STATUS_CODE: -[12]', output)
              receipt.update(componentTestsPassed=passed, stockHelperAssetsQualified=passed,
                  syntheticShaderReceiptGuardsQualified=passed)
              if not passed:
                  raise RuntimeError('Stock shader/helper component class did not report exactly two successful tests')
          except Exception as error:
              receipt['failure'] = type(error).__name__ + ': ' + str(error)[:1024]
              raise
          finally:
              if log.exists():
                  receipt['stdout'] = dict(bytes=log.stat().st_size, sha256=digest(log))
              (destination / 'stock-shader-component.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(json.dumps(receipt, sort_keys=True, indent=2))
          # Real Android URI/document/stream API with an in-process provider and tiny synthetic headers.
          selected = 'io.github.russianranger.esteria.SafImportTest'
          files = ['app/src/androidTest/java/io/github/russianranger/esteria/SafImportTest.java',
                   'app/src/main/java/io/github/russianranger/esteria/SafTreeSource.java',
                   'app/src/main/java/io/github/russianranger/esteria/UriStager.java',
                   'app/src/main/java/io/github/russianranger/esteria/ImportDiagnostics.java',
                   'app/src/main/java/io/github/russianranger/esteria/SessionService.java',
                   'core/src/main/java/io/github/russianranger/esteria/core/importer/GameDataImporter.java',
                   'core/src/main/java/io/github/russianranger/esteria/core/importer/ContentPackageLayout.java']
          receipt = dict(formatVersion=1, scope='android13-x64-document-resolver-synthetic-client-import-components',
              appSourceRevision=os.environ['GITHUB_SHA'], contentProfile='stock-3.3.5a',
              testClass=selected, expectedTests=3, emulatorProperties=properties,
              sources={name: dict(bytes=(root / name).stat().st_size, sha256=digest(root / name)) for name in files},
              componentTestsExecuted=False, componentTestsPassed=False,
              ownerDocumentProviderTested=False, ownerGameDataImported=False,
              androidArm64Qualified=False, thorQualified=False, gameplayQualified=False)
          log = destination / 'saf-import-component.log'
          try:
              code, output = run_bounded(['adb', 'shell', 'am', 'instrument', '-w', '-r', '-e', 'class',
                  selected, PACKAGE + '.test/androidx.test.runner.AndroidJUnitRunner'], log, 600, 256 * 1024)
              receipt.update(componentTestsExecuted=True, processExitCode=code)
              passed = code == 0 and bool(re.search(r'^OK \(3 tests\)\s*$', output, re.M)) and bool(
                  re.search(r'^INSTRUMENTATION_CODE: -1\s*$', output, re.M)) and not re.search(
                  r'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|INSTRUMENTATION_STATUS_CODE: -[12]', output)
              receipt['componentTestsPassed'] = passed
              if not passed:
                  raise RuntimeError('SAF import component class did not report exactly three successful tests')
          except Exception as error:
              receipt['failure'] = type(error).__name__ + ': ' + str(error)[:1024]
              raise
          finally:
              if log.exists():
                  receipt['stdout'] = dict(bytes=log.stat().st_size, sha256=digest(log))
              (destination / 'saf-import-component.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(json.dumps(receipt, sort_keys=True, indent=2))
          selected = 'io.github.russianranger.esteria.ImportMemoryStressTest,io.github.russianranger.esteria.ProcessExitDiagnosticsTest'
          files = ['app/src/androidTest/java/io/github/russianranger/esteria/ImportMemoryStressTest.java',
                   'app/src/androidTest/java/io/github/russianranger/esteria/ProcessExitDiagnosticsTest.java',
                   'app/src/main/java/io/github/russianranger/esteria/ProcessExitDiagnostics.java',
                   'app/src/main/java/io/github/russianranger/esteria/SafTreeSource.java',
                   'app/src/main/java/io/github/russianranger/esteria/UriStager.java',
                   'app/src/main/java/io/github/russianranger/esteria/ImportDiagnostics.java',
                   'app/src/main/java/io/github/russianranger/esteria/SessionService.java',
                   'core/src/main/java/io/github/russianranger/esteria/core/importer/GameDataImporter.java',
                   'core/src/main/java/io/github/russianranger/esteria/core/importer/ZipSafety.java']
          receipt = dict(formatVersion=1, scope='android13-x64-large-streaming-import-memory-and-exit-history-components',
              appSourceRevision=os.environ['GITHUB_SHA'], contentProfile='stock-3.3.5a',
              testClass=selected, expectedTests=5, emulatorProperties=properties,
              sources={name: dict(bytes=(root / name).stat().st_size, sha256=digest(root / name)) for name in files},
              componentTestsExecuted=False, componentTestsPassed=False,
              realLowMemoryKillReproduced=False, ownerDocumentProviderTested=False,
              ownerGameDataImported=False, androidArm64Qualified=False, thorQualified=False, gameplayQualified=False)
          log = destination / 'import-memory-component.log'
          try:
              code, output = run_bounded(['adb', 'shell', 'am', 'instrument', '-w', '-r', '-e', 'class',
                  selected, PACKAGE + '.test/androidx.test.runner.AndroidJUnitRunner'], log, 1200, 256 * 1024)
              receipt.update(componentTestsExecuted=True, processExitCode=code)
              passed = code == 0 and bool(re.search(r'^OK \(5 tests\)\s*$', output, re.M)) and bool(
                  re.search(r'^INSTRUMENTATION_CODE: -1\s*$', output, re.M)) and not re.search(
                  r'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|INSTRUMENTATION_STATUS_CODE: -[12]', output)
              observations = [json.loads(line.split('IMPORT_MEMORY_STRESS=', 1)[1].strip())
                  for line in output.splitlines() if 'IMPORT_MEMORY_STRESS=' in line]
              if len(observations) != 3 or any(not isinstance(row, dict) for row in observations):
                  raise RuntimeError('Expected three measured import-memory stress observations')
              receipt['stressObservations'] = observations
              receipt['componentTestsPassed'] = passed
              if not passed:
                  raise RuntimeError('Import memory/exit-history components did not report exactly five successful tests')
          except Exception as error:
              receipt['failure'] = type(error).__name__ + ': ' + str(error)[:1024]
              raise
          finally:
              if log.exists():
                  receipt['stdout'] = dict(bytes=log.stat().st_size, sha256=digest(log))
              (destination / 'import-memory-component.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(json.dumps(receipt, sort_keys=True, indent=2))
          PY
      - name: Run real app-private filesystem and package-update contracts
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            python3 tools/qualify_android_installer.py --initial-apk out/android-installer/initial.apk --update-apk out/android-installer/update.apk --test-apk out/android-installer/tests.apk --output out/android-installer/evidence
            PYTHONPATH="$PWD" python3 out/android-installer/stock-shader-component.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-13-installer-evidence-${{ github.sha }}
          path: out/android-installer/evidence
          if-no-files-found: warn
          retention-days: 14
