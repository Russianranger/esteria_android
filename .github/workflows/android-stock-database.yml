name: Signed reconstructed Grunt and stock authserver on native Android
on:
  push:
    branches: [qa/android-arm64-grunt-v19]
permissions:
  contents: read
  actions: read
jobs:
  database:
    if: github.repository == 'Russianranger/esteria_android' && contains(github.event.head_commit.message, '[qualify signed Android Grunt]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 72
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 17506ec8df7a57847d72b03f3972d8eee88d4a45
          path: detached-proof
          sparse-checkout: runtime/releases/non-custom/update-19
          persist-credentials: false
      - name: Restore the measured v19 signature over the original unsigned CI producer
        shell: bash
        env:
          ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/stock-detached.XXXXXXXX")
          test "$(git -C detached-proof rev-parse HEAD)" = 17506ec8df7a57847d72b03f3972d8eee88d4a45
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $ARTIFACT_TOKEN" \
            https://api.github.com/repos/Russianranger/esteria_android/actions/artifacts/13609629822/zip \
            -o "$work/package.zip"
          unset ARTIFACT_TOKEN
          bash tools/android_stock_database/restore_candidate.sh "$work/package.zip" \
            detached-proof/runtime/releases/non-custom/update-19 "$work"
          echo "ESTERIA_DETACHED_CANDIDATE=$work/signed.apk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Stage Android platform 35, portable D8 for the package-UID observer
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/stock-shader-sdk"
          mkdir -p "$sdk/platforms" "$sdk/build-tools"
          tools_url=https://dl.google.com/android/repository
          curl --fail --location --retry 3 "$tools_url/platform-35_r02.zip" -o "$RUNNER_TEMP/stock-sdk.zip"
          curl --fail --location --retry 3 "$tools_url/build-tools_r35_linux.zip" -o "$RUNNER_TEMP/stock-build-tools.zip"
          echo "0bb560a90a7a2cbd0dd8348224d518b638fe7949  $RUNNER_TEMP/stock-sdk.zip" | sha1sum -c
          echo "2cfaa0bbb2336e9ec18ed3ecea84fa2e2af607bc  $RUNNER_TEMP/stock-build-tools.zip" | sha1sum -c
          unzip -q "$RUNNER_TEMP/stock-sdk.zip" -d "$sdk/platforms"
          unzip -q "$RUNNER_TEMP/stock-build-tools.zip" -d "$sdk/build-tools"
          platform=$(find "$sdk/platforms" -mindepth 1 -maxdepth 1 -type d)
          build=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d)
          if [[ "$platform" != "$sdk/platforms/android-35" ]]; then mv "$platform" "$sdk/platforms/android-35"; fi
          if [[ "$build" != "$sdk/build-tools/35.0.0" ]]; then mv "$build" "$sdk/build-tools/35.0.0"; fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/d8"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Exercise signed v18 to v19 native client update, offline Grunt and cold SQL response
        run: bash tools/android_stock_database/host_run.sh
      - name: Retain redacted results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-grunt-evidence
          path: ${{ runner.temp }}/android-stock-db-evidence/*.json
          retention-days: 7
          if-no-files-found: warn
