name: Pinned ARM64 display and audio helpers
on:
  push:
    branches: [android/client-server]
    paths: [native/guest-bridges/**, native/guest-tests/**, native/presentation/**, runtime/bridges/**, runtime/bridge-reference.json, tools/qualify_x11_input.py, tests/test_x11_input_qualification.py, tests/fixtures/X11AuthorityFixture.java, core/src/main/java/io/github/russianranger/esteria/core/presentation/X11SessionPlan.java, .github/workflows/guest-bridges.yml]
  pull_request:
    paths: [native/guest-bridges/**, native/guest-tests/**, native/presentation/**, runtime/bridges/**, tools/qualify_x11_input.py, tests/test_x11_input_qualification.py, tests/fixtures/X11AuthorityFixture.java, core/src/main/java/io/github/russianranger/esteria/core/presentation/X11SessionPlan.java, .github/workflows/guest-bridges.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guest-bridges-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install host formatter compiler and namespace diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless iproute2 binutils
      - name: Verify build-input and ELF rejection contracts
        env:
          ESTERIA_REQUIRE_JAVA_TESTS: '1'
        run: python3 -m unittest tests.test_guest_bridge_inputs tests.test_x11_input_qualification -v
      - name: Build exact Debian12 ARM64 guest helpers and retain corresponding sources
        run: |
          test "$(uname -m)" = aarch64
          mkdir -p out/guest-bridges
          docker build --platform linux/arm64 --target x11-test-export \
            --build-context bridge-src=./native \
            --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt \
            --build-arg INTEGRATION_REVISION="$GITHUB_SHA" \
            --output type=local,dest=out/guest-bridges/payload runtime/bridges \
            > out/guest-bridges/build.log 2>&1
          sudo chown -R "$(id -u):$(id -g)" out/guest-bridges
          cp LICENSE out/guest-bridges/payload/notices/ESTERIA-GPL-3.0
          cp runtime/bridge-reference.json out/guest-bridges/payload/corresponding-source/
      - name: Prepare exact Wine-rootfs X11 implementation for offline native ARM64 input checks
        run: |
          python3 tools/prepare_runtime.py --cache "$RUNNER_TEMP/x11-runtime-cache" --download \
            --stage "$RUNNER_TEMP/x11-runtime" --report out/guest-bridges/x11-runtime-preparation.json
      - name: Verify X11 cookie rejection then observe real XTest events and release on EOF
        run: |
          sudo python3 tools/qualify_x11_input.py --runtime "$RUNNER_TEMP/x11-runtime" \
            --bridge-dir "$GITHUB_WORKSPACE/out/guest-bridges/payload" --bridge-revision "$GITHUB_SHA" \
            --output "$GITHUB_WORKSPACE/out/guest-bridges/x11-evidence"
      - name: Preserve build evidence
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out/guest-bridges
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unqualified-linux-arm64-guest-bridges-${{ github.sha }}
          path: |
            out/guest-bridges
            runtime/bridges
            runtime/bridge-reference.json
            native/guest-bridges
            native/guest-tests
            native/presentation
            core/src/main/java/io/github/russianranger/esteria/core/presentation/X11SessionPlan.java
            tests/fixtures/X11AuthorityFixture.java
            tools/qualify_x11_input.py
            LICENSE
          retention-days: 14
