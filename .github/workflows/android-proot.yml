name: Android ARM64 PRoot build and packaging
on:
  push:
    branches: [android/client-server]
    paths:
      - 'runtime/proot/**'
      - 'tools/build_android_proot.py'
      - 'tools/android_elf.py'
      - 'tools/verify_android_proot.py'
      - 'tools/qualify_proot_ownership.py'
      - 'tools/prepare_runtime.py'
      - 'tests/test_android_proot.py'
      - 'app/**'
      - '.github/workflows/android-proot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-proot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Download exact source and NDK archives
        run: |
          curl --fail --location --retry 2 --max-time 600 https://github.com/Russianranger/uo-android-launcher/releases/download/v0.2.0/runtime-corresponding-sources.tar.gz -o "$RUNNER_TEMP/proot-sources.tar.gz"
          curl --fail --location --retry 2 --max-time 900 https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o "$RUNNER_TEMP/android-ndk-r28c-linux.zip"
      - name: Build real Bionic ARM64 process bridge and source companion
        run: |
          python3 -m unittest tests.test_android_proot -v
          python3 tools/build_android_proot.py --sources "$RUNNER_TEMP/proot-sources.tar.gz" --ndk-zip "$RUNNER_TEMP/android-ndk-r28c-linux.zip" --work "$RUNNER_TEMP/proot-build"
          python3 tools/verify_android_proot.py --provider "$RUNNER_TEMP/proot-build/provider"
      - name: Install Android command-line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Install Android platform and build tools
        run: |
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify internal APK payload bytes
        run: |
          sha256sum --check gradle/wrapper/SHA256SUMS
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug -PsourceRevision="${GITHUB_SHA}" -PprootProviderDir="$RUNNER_TEMP/proot-build/provider"
          python3 tools/verify_android_proot.py --provider "$RUNNER_TEMP/proot-build/provider" --apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > "$RUNNER_TEMP/proot-build/apk-manifest.txt"
          python3 - "$RUNNER_TEMP/proot-build/apk-manifest.txt" <<'PYCODE'
          import pathlib, sys
          manifest = pathlib.Path(sys.argv[1]).read_text()
          assert 'package="io.github.russianranger.esteria"' in manifest
          assert 'android:extractNativeLibs(0x010104ea)=(type 0x12)0xffffffff' in manifest
          PYCODE
      - name: Retain build evidence and corresponding sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unqualified-android-proot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proot-build/build.log
            ${{ runner.temp }}/proot-build/build-evidence.json
            ${{ runner.temp }}/proot-build/apk-manifest.txt
            ${{ runner.temp }}/proot-build/provider
            ${{ runner.temp }}/proot-build/proot-corresponding-source.tar.gz
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
          retention-days: 14
  ownership:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Acquire pinned corresponding source
        run: curl --fail --location --retry 2 --max-time 600 https://github.com/Russianranger/uo-android-launcher/releases/download/v0.2.0/runtime-corresponding-sources.tar.gz -o "$RUNNER_TEMP/proot-sources.tar.gz"
      - name: Compare original and owned native Linux process trees
        run: python3 tools/qualify_proot_ownership.py --sources "$RUNNER_TEMP/proot-sources.tar.gz" --work "$RUNNER_TEMP/proot-ownership"
      - name: Retain ownership logs and qualification scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-proot-ownership-${{ matrix.runner }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proot-ownership/build.log
            ${{ runner.temp }}/proot-ownership/normal.log
            ${{ runner.temp }}/proot-ownership/baseline.log
            ${{ runner.temp }}/proot-ownership/owned.log
            ${{ runner.temp }}/proot-ownership/ownership-evidence.json
          retention-days: 14
