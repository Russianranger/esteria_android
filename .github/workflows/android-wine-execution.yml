name: Android 13 x86_64 reconstructed client through Wine
on:
  workflow_dispatch:
  push:
    branches: [android/client-server]
    paths:
      - runtime/wine-probe/**
      - runtime/proot/**
      - native/proot-probe/**
      - native/process-owner/**
      - tools/*android_wine*.py
      - tools/build_android_proot_probe.py
      - tools/verify_android_proot_probe.py
      - tests/test_android_wine*.py
      - app/wine-probe.gradle
      - app/proot-probe.gradle
      - app/src/wineProbeAndroidTest/**
      - .github/workflows/android-wine-execution.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: android-wine-execution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Acquire the exact reconstructed client Git tree
        run: |
          test "$(uname -m)" = x86_64
          revision=$(python3 -c 'import json;print(json.load(open("runtime/wine-probe/client-input.lock.json"))["sourceRevision"])')
          mkdir -p "$RUNNER_TEMP/wine-client-source"
          git -C "$RUNNER_TEMP/wine-client-source" init
          git -C "$RUNNER_TEMP/wine-client-source" fetch --depth 1 https://github.com/Russianranger/wowdecomp_esteria.git "$revision"
          git -C "$RUNNER_TEMP/wine-client-source" checkout --detach FETCH_HEAD
          mkdir -p out/android-wine
      - name: Recover exact successful artifacts and verify complete original sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/fetch_android_wine_probe.py --client-source "$RUNNER_TEMP/wine-client-source" --output "$RUNNER_TEMP/wine-inputs"
          ESTERIA_WINE_PROBE_CLIENT_ARTIFACT="$RUNNER_TEMP/wine-inputs/client.zip" ESTERIA_WINE_PROBE_CLIENT_SOURCE="$RUNNER_TEMP/wine-client-source" \
            python3 -m unittest tests.test_android_wine_runtime tests.test_android_wine_probe tests.test_android_wine_sources -v
      - name: Enable KVM for the disposable emulator
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exact Android command-line tools and pinned toolchain
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/esteria-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  '"$RUNNER_TEMP/android-commandline.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          export PATH="$ANDROID_HOME/cmdline-tools/12.0/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null)
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/12.0/bin" >> "$GITHUB_PATH"
      - name: Build separate pinned x64 tracer and reconstructed-client provider
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from tools.prepare_runtime import fetch
          fetch(json.loads(Path('runtime/proot/sources.lock.json').read_text())['source'],Path(os.environ['RUNNER_TEMP'])/'probe-cache')
          PY
          python3 tools/build_android_proot_probe.py --sources "$RUNNER_TEMP/probe-cache/runtime-corresponding-sources.tar.gz" \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" --cache "$RUNNER_TEMP/probe-cache" --download --work "$RUNNER_TEMP/proot-probe"
          python3 tools/build_android_wine_probe.py --runtime-package "$RUNNER_TEMP/wine-inputs/runtime-package" \
            --client-artifact "$RUNNER_TEMP/wine-inputs/client.zip" --client-source "$RUNNER_TEMP/wine-client-source" --output "$RUNNER_TEMP/wine-provider" \
            > out/android-wine/provider-build.json
          ESTERIA_PROOT_PROBE_BUILD="$RUNNER_TEMP/proot-probe" python3 -m unittest tests.test_android_wine_sources -v
      - name: Seal all original and relinkable sources before binary execution
        id: sources
        run: |
          python3 tools/package_android_wine_sources.py --runtime-package "$RUNNER_TEMP/wine-inputs/runtime-package" \
            --runtime-sources "$RUNNER_TEMP/wine-inputs/runtime-sources.zip" --proot-sources "$RUNNER_TEMP/proot-probe/corresponding-source.tar.gz" \
            --proot-provider "$RUNNER_TEMP/proot-probe/provider" --client-source "$RUNNER_TEMP/wine-client-source" \
            --xvid-source "$RUNNER_TEMP/wine-inputs/xvidcore-1.3.7.tar.gz" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/wine-source-companion" \
            > out/android-wine/source-receipt.json
      - name: Build and verify exact optional Wine diagnostic APK
        run: |
          sha256sum --check gradle/wrapper/SHA256SUMS
          ./gradlew --no-daemon :app:clean :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug \
            -PnativeRuntimeBridge=true -PnativeBridgeAbi=x86_64 -PprootProbeProviderDir="$RUNNER_TEMP/proot-probe/provider" \
            -PwineProbeProviderDir="$RUNNER_TEMP/wine-provider" -PwineProbeRuntimePackage="$RUNNER_TEMP/wine-inputs/runtime-package" \
            -PwineProbeClientArtifact="$RUNNER_TEMP/wine-inputs/client.zip" -PwineProbeClientSource="$RUNNER_TEMP/wine-client-source" -PsourceRevision="$GITHUB_SHA"
          cp app/build/outputs/apk/debug/app-debug.apk out/android-wine/probe.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/android-wine/tests.apk
          python3 tools/verify_android_wine_probe.py --provider "$RUNNER_TEMP/wine-provider" --proot-provider "$RUNNER_TEMP/proot-probe/provider" \
            --runtime-package "$RUNNER_TEMP/wine-inputs/runtime-package" --client-artifact "$RUNNER_TEMP/wine-inputs/client.zip" \
            --client-source "$RUNNER_TEMP/wine-client-source" --apk out/android-wine/probe.apk > out/android-wine/apk-verification.json
      - name: Execute actual Wine prefix and reconstructed entry offline and loopback diagnostics
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 4096M
          heap-size: 256M
          disk-size: 6144M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/qualify_android_wine.py --apk out/android-wine/probe.apk --test-apk out/android-wine/tests.apk --provider "$RUNNER_TEMP/wine-provider" --proot-provider "$RUNNER_TEMP/proot-probe/provider" --runtime-package "$RUNNER_TEMP/wine-inputs/runtime-package" --client-artifact "$RUNNER_TEMP/wine-inputs/client.zip" --client-source "$RUNNER_TEMP/wine-client-source" --source-revision "$GITHUB_SHA" --output out/android-wine/evidence
      - name: Retain bounded execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-x64-wine-evidence-${{ github.sha }}
          path: |
            out/android-wine/*.json
            out/android-wine/evidence
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - name: Retain complete source companion even after execution failure
        if: always() && steps.sources.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-x64-wine-corresponding-sources-${{ github.sha }}
          path: ${{ runner.temp }}/wine-source-companion
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
